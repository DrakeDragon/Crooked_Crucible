'use strict';
/* ===== GUIDED OPENING: a story-driven tutorial. Each chapter teaches one system, auto-opens when the player is ready, and sets a visible goal. ===== */
(function(){
var T=[
{id:'prologue',title:'A Very Crooked Inheritance',icon:'anvil',auto:true,when:{},goal:{text:'Welcome to Tinderbury. Read on, Spark.',tab:'forge'},nodes:{
start:{p:['>Dunstan|Ahem. Hello? You. The one drooling on the floorboards. Wake up.','You wake face-down in sawdust inside a workshop that lost an argument with a tornado and then lost another with a fire. A battered crucible dangles over a cold forge. Beside it sits an anvil. The anvil is looking at you.','>Dunstan|Yes, me. Don\'t scream, it\'s undignified, and the last person who screamed knocked over the quench barrel. Welcome to The Crooked Crucible, finest forgery in Tinderbury. <i>Formerly.</i> Currently it is an expensive pile of splinters, and it is yours.','A letter lies by your hand, sealed with a thumbprint in soot. It is from your Great-Aunt Billie Quench, whom you met once, at a funeral, where she gave a toast and then stole the cake.'],
 c:[{t:'Read the letter',go:'letter'},{t:'Argue with the anvil',go:'argue'},{t:'Scream anyway',go:'scream'}]},
argue:{p:['>Dunstan|I am not "a talking anvil." I am a <i>sentient</i> anvil with an inner life. The difference is mostly ego, and you may call me Dunstan.','>Dunstan|Now read the letter before you start talking to the furnace. The furnace is not sentient. It is just rude.'],c:[{t:'Fine. Read the letter',go:'letter'}]},
scream:{p:['You scream. A barrel of questionable water meets the floor. Something in the corner hisses and goes out.','>Dunstan|Told you. That was your first lesson: <i>listen to the anvil.</i> The second is: don\'t stand in puddles near a forge.'],c:[{t:'Read the letter',go:'letter'}]},
letter:{p:['>Aunt Billie|Dear Spark. If you\'re reading this I\'m either dead or have finally mastered dramatic exits. Either way: The Crooked Crucible is yours.','>Aunt Billie|It has ten stations. Ten crafts. Seven Marks to earn. Master seven of them and I\'ll leave you something worth having. Master none, and the Gilded Concord gets the deed, and I would haunt you, but I\'m told I\'m not allowed.','The paper smells of smoke, lavender and mild fraud.'],c:[{t:'Keep reading',go:'letter2'}]},
letter2:{p:['>Aunt Billie|The Concord are a chain of very polite, very rich men who sell things designed to break. They want my forge because it is the last place in Tinderbury that makes things <i>properly</i>. Do not let them have it.','>Aunt Billie|Trust the anvil. He\'s insufferable but he\'s not wrong. Love, Billie. P.S. The cake was dry anyway.','>Dunstan|She was a menace. I loved her. Anyway.'],c:[{t:'"Who are the Concord, exactly?"',go:'concord'},{t:'"Can we skip to the hitting things?"',go:'rules'}]},
concord:{p:['>Dunstan|The Gilded Concord. Gildenhoard & Sons. Founded 31 years ago, <i>Guaranteed™ to disappoint within 90 days</i>. Their motto is "Buy Again." They make a chair that collapses on a timer. I wish I were joking.','>Dunstan|The Concord\'s agent, Calla Brightforge, will be in town by the end of the season to inspect the deed. If this forge isn\'t running, she takes it. So. We make it run.','>Dunstan|That\'s all you need to know for now. The rest of it you\'ll find out by being very stubborn.'],c:[{t:'"Fine. How does this work?"',go:'rules'}]},
rules:{p:['>Dunstan|Three loops, Spark. They feed each other. I\'ll teach you one at a time, because I like the sound of my own voice.','<b>1. GATHER</b> — go out, pick up ore, logs, fiber, food. It costs a little stamina ⚡ that comes back by itself.','<b>2. CRAFT</b> — turn that stuff into ingots, planks, cloth… then into weapons, armor, potions, snacks. Every craft has its own level, perks and a mentor with Opinions.','<b>3. FIGHT &amp; SELL</b> — monsters drop rare materials. Gear you make decides whether you win. Everything else you sell, or hand to customers who pay extra.','>Dunstan|Do all three, level everything, save the forge. First lesson: tap that <b>Gather</b> tab down there. I\'ll wait. I\'m an anvil. Waiting is my whole personality.'],
 c:[{t:'Let\'s light this crooked thing',end:true,fx:{g:30,it:[['copper_ore',9],['flax',4],['pine_log',12],['wheat',3],['sand',4],['quartz',3]],fl:'prologue'}}]}}},

{id:'tut_gather',title:'Dirt Under the Fingernails',icon:'🌾',auto:true,when:{after:'prologue'},goal:{text:'Open the <b>Gather</b> tab and tap <b>Gather</b> 6 times in the Meadows.',tab:'gather'},nodes:{
start:{p:['The meadow outside is the kind of green that suggests nobody has ever tried to sell it to you.','>Dunstan|Gather tab. Big button. Tap it. Each tap spends a little stamina ⚡ (top right of your screen) and you get a handful of whatever the land feels like handing over. Copper, flax, wheat, pine logs…','>Dunstan|Stamina refills on its own while you do other things, even while the game is closed. Rest is free. Honesty in a fantasy world, imagine.'],
 c:[{t:'"What if I run out?"',go:'stam'},{t:'"Anything else I should know?"',go:'zones'},{t:'On it',end:true}]},
stam:{p:['>Dunstan|Then you wait, or you eat or drink something. Food and potions refill ⚡ and give buffs. You\'ll learn to cook eventually. Gran Marrow insists.'],c:[{t:'"Anything else?"',go:'zones'},{t:'On it',end:true}]},
zones:{p:['>Dunstan|The map has more places than that meadow. New ones unlock as you level. Each has its own loot, and a zone gets better the more you work it (Zone Mastery, look for the little stars).','>Dunstan|Later you can hire apprentices to gather while you do something else. Cheap labor, dignified. Anyway. Go tap the thing.'],c:[{t:'On it',end:true}]}}},

{id:'tut_smelt',title:'The Gullet Has Feelings',icon:'🔥',auto:true,when:{after:'tut_gather',st:{gathered:6}},goal:{text:'Open the <b>Forge</b> tab → <b>Smelting</b>. Craft 3 Copper Ingots.',tab:'forge'},nodes:{
start:{p:['You return with pockets full of unreasonable amounts of rock. A small man with a beard like an exploded mattress waves from behind a furnace.','>Pip Slagwick|Old Pip! Smelting, they call me! Mostly "Oi, Pip." Welcome, welcome. That\'s Gladys. Be nice. She remembers.','The furnace — the Gullet — gurgles. It sounds like a very large cat disagreeing.'],
 c:[{t:'"Hello, Gladys."',go:'hi'},{t:'"How do I smelt something?"',go:'how'}]},
hi:{p:['The Gullet purrs. Embers drift up in what you decide to interpret as a wink.','>Pip Slagwick|She likes you! She tolerated the last one for four minutes. We\'re in uncharted territory.'],c:[{t:'"How do I smelt something?"',go:'how'}]},
how:{p:['>Pip Slagwick|Forge tab. You\'ll see your stations. Tap <b>Smelting</b>. Every craft shows its recipes — green means you can make it now, grey means you\'re short, a padlock means you\'re too low-level.','>Pip Slagwick|Three copper ore makes one ingot. Tap <b>Craft</b>, or <b>×5</b> for a batch. Each craft gives craft-XP for <i>that</i> station and a smaller bit of hero-XP. First time you make something? Four times the XP. Curiosity pays.','>Pip Slagwick|Make three ingots. Ingots are the glue of civilization. And swords.'],c:[{t:'On it',end:true}]}}},

{id:'tut_wood',title:'Elmira Has Opinions About Planks',icon:'🪚',auto:true,when:{after:'tut_smelt',st:{mk_ingot_1:3}},goal:{text:'<b>Forge</b> → <b>Woodworking</b>: craft Pine Planks, then a <b>Pine Club</b>.',tab:'forge'},nodes:{
start:{p:['>Dunstan|Ingots are nice. Ingots do not, on their own, hit anything. For that we need a handle, and for <i>that</i>…','A woman with leaves in her hair steps out of what you were sure was a wall. Elmira Splint, who talks to trees and is worryingly good at winning.','>Elmira Splint|Planks first. Logs go in, planks come out. A plank is a log that has been told to calm down. Then a club. Every <i>recipe</i> uses ingredients, and some of those ingredients are things <i>you made</i>. That\'s the whole game, darling. Make the thing to make the thing.','>Elmira Splint|And watch the <b>quality</b>. Gear can come out Crude, Standard, Fine, Superior, Masterwork, or — rarely — Legendary. Higher quality, higher stats, higher price. Craft level and tools push the odds up.'],
 c:[{t:'"A club. Got it."',end:true,fx:{it:[['pine_log',6]]}},{t:'"Can I hit things with a plank?"',go:'plank'}]},
plank:{p:['>Elmira Splint|Technically. Spiritually, no. Make the club.'],c:[{t:'On it',end:true,fx:{it:[['pine_log',6]]}}]}}},

{id:'tut_gear',title:'Dress for the Occasion',icon:'🧥',auto:true,when:{after:'tut_wood',st:{mk_club_1:1}},goal:{text:'<b>Hero</b> tab → Gear: <b>Equip</b> your club, cap and boots.',tab:'hero'},nodes:{
start:{p:['The club is, objectively, a stick with ambition. You love it.','Hildy Stonehammer wanders in, looks at your club, looks at you, looks at the club.','>Hildy Stonehammer|Hm. It\'s a club.','>Hildy Stonehammer|It\'s a <i>good</i> club. Don\'t get excited. Here — I made these ages ago and they\'ve been annoying my bench. A cap and a pair of boots. They\'re Fine quality, so don\'t scuff them.','>Hildy Stonehammer|Open the <b>Hero</b> tab and equip the lot. Every piece has stats: <b>Might</b> helps you gather and hit, <b>Grit</b> gives stamina and toughness, <b>Finesse</b> speeds crafting and dodging, <b>Wits</b> improves quality, <b>Charm</b> gets you better prices. Weapons also decide your <b>fighting style</b>. You\'ll need that soon.'],
 c:[{t:'"Equip all three. Got it."',end:true,fx:{it:[['cap_1',1],['boots_1',1]]}}]}}},

{id:'tut_hunt',title:'A Goose Most Foul',icon:'🦆',auto:true,when:{after:'tut_gear',st:{equips:3}},goal:{text:'Open the <b>Hunt</b> tab and defeat a few foes. Gear and weapon style decide fights.',tab:'hunt'},nodes:{
start:{fx:{fl:'hunt_unlocked'},p:['A loud, wet, <i>aggrieved</i> noise comes from the doorway. Something white and furious waddles in and bites a chair. The chair loses.','>Dunstan|Oh no. That\'s Honkmore\'s finest. It has been terrorizing the mayor for three weeks. The mayor is hiding in a barrel. The barrel is also scared.','>Dunstan|This is your first <b>fight</b>. It\'s turn-based: you act, then it acts. <b>Attack</b> to swing, <b>Skill</b> for a big move (it has a cooldown and costs ⚡), <b>Guard</b> to halve damage and heal a bit, <b>Items</b> to eat food or use potions. Watch the warning line — when the enemy winds up, <i>guard</i>.','>Dunstan|I\'ve… slightly nerfed this particular goose. For tutorial reasons. Do not tell it.'],
 c:[{t:'"Honk this."',fight:'honkmore_0',mods:{hp:0.6,atk:0.6},tips:true,win:'won',lose:'lost'},{t:'"What decides if I win?"',go:'why'}]},
why:{p:['>Dunstan|Your gear, mostly. Everything you wear adds <b>Gear Score</b>. Weapons set your style: <b>Heavy</b> (Might) crushes, <b>Swift</b> (Finesse) strikes twice, <b>Arcane</b> (Wits) cuts through armor. Foes have <b>kinds</b> — armored, ethereal, brute, swift, caster — and <b>weaknesses</b> to Ember, Frost, Storm and Void. Enchanted gear matches them.','>Dunstan|Higher zones refuse you until your Gear Score is high enough. Craft better. Craft <i>quality</i>. That\'s the point of all of this.'],c:[{t:'"Alright. Goose time."',fight:'honkmore_0',mods:{hp:0.6,atk:0.6},tips:true,win:'won',lose:'lost'}]},
won:{p:['The goose collapses, honking weakly, then <i>sulks</i>. A single feather drifts down. The mayor\'s barrel creaks open an inch.','>Dunstan|…You hit a goose. Good. That feather is a <i>Fiber</i>, and fiber becomes cloth, and cloth becomes things that stop you being hit. Everything you kill drops stuff like that.','>Dunstan|Go to the Hunt tab and keep at it. A few more kills. Win fights → loot → better gear → harder zones. There\'s a Bestiary that tracks every foe, and every zone has a <b>Boss</b> and a <b>Gauntlet</b> for when you\'re feeling reckless.'],c:[{t:'Collect the feather',end:true,fx:{xp:60,g:40,it:[['flax',3]]}}]},
lost:{p:['The goose, clearly a professional, has you flat on the floor and is standing on your chest. It looks pleased.','>Dunstan|It\'s a nerfed goose, Spark. Do try to not lose to a nerfed goose.','>Dunstan|Tip: tap <b>Guard</b> when it winds up, and use your skill when it\'s ready.'],c:[{t:'Get back up',go:'start'}]}}},

{id:'tut_market',title:'Coin Is a Verb',icon:'💰',auto:true,when:{after:'tut_hunt',st:{kills:3}},goal:{text:'<b>Market</b> tab → Sell: sell 3 items (monster drops and spare crafts both count).',tab:'market'},nodes:{
start:{p:['Your pack is getting full of things that are very much not coins.','A cheerful, nervous man in a green waistcoat appears: Mayor Hobbs, out of his barrel, with a sack and a faint smell of gravy.','>Mayor Hobbs|The goose! The goose is gone! I— that is — thank you. I\'d like to buy things. Anything. Everything. Please accept my sincere gratitude and an itemized invoice.','>Dunstan|He means: tap the <b>Market</b>. Items sell for a base price times what the town wants this hour. Demand changes every few minutes (check the ticker) and flooding the same item <i>drops its price</i> for a while, so vary what you sell. Materials sell low. Crafted gear and potions sell high. Quality matters most.','>Dunstan|The Market also has a <b>Shop</b> for buying raw materials and a <b>Merchant</b> who turns up with rare stock. Sell three things. We have rent to dodge.'],
 c:[{t:'"Selling. Revolutionary."',end:true,fx:{g:25}}]}}},

{id:'tut_orders',title:'The Customer Is Occasionally Right',icon:'📜',auto:true,when:{after:'tut_market',st:{sold:3}},goal:{text:'<b>Orders</b> tab: deliver one customer commission.',tab:'orders'},nodes:{
start:{p:['The door bangs open. Wendel the Bard strides in, plucks a lute string, and winces.','>Wendel|I seek a commission of epic proportions! Or at least a bit of rope.','>Dunstan|He wants a thing. This is <b>Orders</b>. Townsfolk — twenty-five regulars, eventually, all deeply weird — post requests for particular items, sometimes needing a minimum quality. They pay <i>more</i> than the market and give <b>Renown</b>, which raises your rank and makes everyone nicer to you.','>Dunstan|Look at the board. Pick something you can make. Craft it. Hand it over. If an order is a bad fit, skip it — a new one shows up soon.'],
 c:[{t:'"I\'m a professional."',end:true}]}}},

{id:'tut_levels',title:'Level Up, Level Whatever',icon:'📈',auto:true,when:{after:'tut_orders',st:{comsDone:1}},goal:{text:'<b>Hero</b> → Talents: spend a talent point.',tab:'hero'},nodes:{
start:{p:['Gran Marrow, carrying a casserole with a heartbeat, corners you at the door.','>Gran Marrow|You\'re getting <i>stronger</i>, dear. Leveling, they call it. Two sorts: your <b>hero level</b>, which gives <b>talent points</b>, and each <b>craft level</b>, which unlocks recipes and a <b>Perk</b> every five levels.','>Gran Marrow|At craft level 15 you earn a <b>Mark of Mastery</b>. Seven Marks and the Guildhall opens. Also, stations: spend gold and materials to upgrade a station and you can make better <i>tiers</i> of things.','>Gran Marrow|Spend that talent point. Pick something you\'ll feel. Eat something. You look thin.'],
 c:[{t:'"Yes, Gran."',end:true,fx:{sp:1}}]}}},

{id:'tut_apprentice',title:'Cheap Labor, Dignified',icon:'🧑‍🔧',auto:true,when:{after:'tut_levels',st:{talents:1}},goal:{text:'<b>Gather</b> tab: hire your first apprentice.',tab:'gather'},nodes:{
start:{p:['A hand-painted sign has appeared on the Crucible door. It reads: <i>"HELP WANTED. MUST ENJOY SOOT."</i> There is already a queue. It consists of one boy and a goat.','>Dunstan|Apprentices. You hire them, assign a zone, and they gather in the background — even while the game\'s closed, within reason. They level up and fill your <b>haul wagon</b>; collect from the Gather tab. More hires cost more. Worth every coin.','>Dunstan|One more thing — in Settings you can switch on <b>Hands-on crafting</b>, a timing mini-game that makes your gear better. Optional. Satisfying. A little rude to the anvil.','>Dunstan|You\'ve got the basics, Spark. Gather, craft, fight, sell, serve, level. The rest of this is just doing all of it, better, for a very long time. Let\'s go save the forge.'],
 c:[{t:'"The Gilded Concord won\'t know what hit them."',end:true,fx:{g:80,xp:100}}]}}}
];
for(var i=T.length-1;i>=0;i--)STORY.unshift(T[i]);
STORY_BY=STORY_BY||{};STORY.forEach(function(s){STORY_BY[s.id]=s;});
})();
'use strict';
/* Craft tales: [craft, lv, title, [paragraphs], [[choice, result, fx], [choice, result, fx]]] */
var TALES_RAW=[
['smelting',1,'The Fire Has Opinions',['Old Pip Slagwick, a gnome with a beard that has been singed into a permanent question mark, pats the furnace. "The Gullet is moody today. Don\'t make eye contact."','The furnace belches. It sounds, unmistakably, like a sigh.'],[['Compliment the furnace','The Gullet glows a flattered orange. Pip nods, impressed. "It likes you. That\'s never happened."',{g:30,cx:['smelting',40]}],['Feed it extra coal','It burns hotter and burps a small cloud of soot. Pip coughs. "That works too. Gently."',{it:[['coal',4]],xp:25}]]],
['smelting',8,'Pip\'s Secret Alloy',['Pip leans in. "Once, I smelted a sunbeam. Didn\'t mean to. It was in the ore."','"It made a metal that sang. I sold it for a pie."'],[['Ask for the pie recipe','Pip gives you a handwritten pie recipe and winks. It has one ingredient: "hope."',{xp:40,bless:['xp',10,20]}],['Ask how to find another sunbeam','"You don\'t. They find you. Usually at lunch."',{it:[[INGOT[2],3]],xp:30}]]],
['smelting',15,'The Furnace Goes On Strike',['The Gullet goes cold. A tiny sign appears on its door: "ON STRIKE. DEMANDS: BETTER COAL, LESS SHOUTING."','Pip reads the sign twice. "It has a point."'],[['Negotiate with it','You promise better coal and fewer lectures. The furnace relights with a cheerful pop.',{g:80,cx:['smelting',80]}],['Bribe it with a sculpture','You place a slag sculpture on the altar. The furnace accepts, grudgingly.',{it:[['coal',10]],xp:60}]]],
['smelting',22,'Slag Is Not Waste',['"Everything is useful," says Pip, scooping slag into a bucket. "Fertilizer. Paving. Poetry. Art."','He hands you a slag-glass pendant. It catches light like a tiny, very bitter star.'],[['Take the pendant','It\'s ugly. It\'s wonderful. You wear it proudly.',{xp:80,it:[['gold_ingot',3]]}],['Sell the slag to Farmer Hale','Hale pays well and doesn\'t ask what it is. Neither do the cows.',{g:300}]]],
['smelting',30,'The Last Ember',['Pip presses his ladle into your hands. "I\'m retiring. Gladys is yours now."','"Gladys?"','"The furnace. She picked the name years ago. Didn\'t tell anyone."'],[['Accept the ladle','Gladys glows approvingly. Pip tears up and blames the smoke.',{xp:200,sp:1}],['Hug Pip','He is very small, very warm, and smells faintly of soup.',{xp:200,sp:1,rep:{guild:2}}]]],

['smithing',1,'Rule One: Hit It Harder',['Hildy Stonehammer, retired arena armorer, slams a hammer on her workbench. "Rule one: hit it harder."','"What\'s rule two?"','"Rule one, but with feeling."'],[['Hit it harder','CLANG. The anvil—Dunstan—mutters something about "personal space." Hildy beams.',{xp:30,cx:['smithing',40]}],['Ask about technique','Hildy sighs and shows you the proper stance. You feel immediately more competent.',{g:25,bless:['qual',3,20]}]]],
['smithing',8,'The Dagger of Perpetual Mild Embarrassment',['A customer returns a dagger with a note: "It\'s cursed." The dagger only cuts bread, and mutters insults at the bread.','"Pasty," it whispers. "Soft. Gluten."'],[['Break the curse with a good scrub','The dagger sighs, sounds disappointed, and goes quiet.',{g:60,xp:50}],['Keep it as a bread knife','It slices a perfect loaf and says nothing. A small victory.',{it:[['dough',2]],xp:40}]]],
['smithing',15,'A Sword Named Kevin',['A knight insists his sword is named Kevin. "He\'s very sensitive. Please don\'t scratch him."','You inspect Kevin. Kevin seems fine. The knight does not.'],[['Polish Kevin gently','Kevin gleams. The knight sobs gratefully and tips double.',{g:150,xp:60}],['Suggest a nicer name','"Sir Slicer." The knight reconsiders. Kevin does not forgive you.',{xp:90,cx:['smithing',60]}]]],
['smithing',22,'The Tournament of Mild Danger',['Tinderbury\'s annual tournament has a rule: no one dies, no one cheats, and everyone has a snack.','Hildy enters you as a "technical consultant," which means you hold her sword and nod.'],[['Fix her blade between rounds','Hildy wins by a nose. The crowd throws flowers, bread and one small dog.',{g:400,xp:120}],['Distract her opponent','Your distraction is a juggling goat. It works shockingly well.',{xp:140,rep:{town:2}}]]],
['smithing',30,'Hildy\'s Last Swing',['Hildy lowers her hammer. "I\'ve taught you everything I know and several things I made up."','She hands you her apron. It has burn marks, ink stains, and the faint smell of victory.'],[['Wear the apron','It fits perfectly. That\'s suspicious, and also lovely.',{xp:200,sp:1}],['Hang it on the wall','It looks good there. Hildy approves with a grunt.',{xp:200,sp:1,rep:{guild:2}}]]],

['armoring',1,'Dents Build Character',['Sir Bartleby Dent adjusts a breastplate that looks like it lost a fight with a barn. "Dents are memories, young smith."','"That one\'s a barn," he adds.'],[['Ask about the barn','"Cows," he says darkly, and says no more.',{xp:30,cx:['armoring',40]}],['Offer to fix a dent','He recoils. "Never. That\'s Gerald."',{g:20,bless:['qual',3,20]}]]],
['armoring',8,'The Helmet That Remembers',['A battered helm hangs on the wall. Bartleby claims it "remembers every blow."','You tap it. It says, very quietly, "ow."'],[['Apologize to the helmet','The helm gives you a small, grateful clunk.',{xp:50,g:40}],['Ask the helmet for advice','"Duck," it says. Solid advice.',{xp:60,bless:['xp',10,20]}]]],
['armoring',15,'Armor for the Anxious',['A knight arrives, afraid of squirrels. "Can you armor me against... small things?"','Bartleby nods gravely. "Thorough coverage. Plus a hat."'],[['Design squirrel-proof armor','You craft little acorn deflectors. The knight cries with relief.',{g:200,xp:70}],['Recommend therapy','The knight takes a card from Brother Alder. Everyone wins.',{xp:80,rep:{town:2}}]]],
['armoring',22,'The Shield Wall Fashion Show',['The town hosts a "shield wall fashion show." Hildy, Bartleby, and Calla Brightforge are all judges. It is deeply chaotic.','You are asked to supply the runway. There is no runway.'],[['Improvise a runway','Planks, nails, and a stern look: a runway. The audience applauds.',{g:350,xp:130}],['Join the wall','You hold a shield and strike a pose. The crowd goes wild.',{xp:150,rep:{town:3}}]]],
['armoring',30,'Bartleby\'s Final Dent',['Bartleby removes his helm for the first time. He has kind, tired eyes. "I\'ve got one dent left in me," he says. "Make it a good one."','He hands you the helm. There\'s a small dent in the forehead, polished smooth.'],[['Keep the helm','It fits you eerily well.',{xp:200,sp:1}],['Hang it beside the door','Visitors ask what it is. You say: "A friend."',{xp:200,sp:1,rep:{guild:2}}]]],

['woodworking',1,'Apology Tour',['Elmira Splint hugs a pine log. "I\'m so sorry," she whispers. "It\'s nothing personal."','She turns to you. "Tell the tree you\'re sorry. It matters."'],[['Apologize to the tree','The tree creaks politely. Elmira nods. You feel like a better person.',{xp:30,cx:['woodworking',40]}],['Thank the tree instead','"That\'s even better," Elmira says, dabbing her eyes.',{g:25,bless:['gather',10,20]}]]],
['woodworking',8,'The Chair That Wanted More',['A chair you built demands a cushion. "I have ambitions," it says.','You are fairly sure you didn\'t carve a mouth into it.'],[['Give it a cushion','The chair purrs, which is unsettling and wonderful.',{xp:50,g:60}],['Explain that chairs sit','"But I want to <i>sit</i> with dignity," it sniffs.',{xp:60,it:[['pine_log',6]]}]]],
['woodworking',15,'Rot in the Rafters',['Termites have invaded the Sawdust Stall. Elmira declines to use poison. "We\'ll negotiate."','You meet with the termite delegation. They have demands.'],[['Offer them the offcuts','They accept. They also demand a small flag.',{xp:70,it:[[PLANK[3],2]]}],['Build a termite hotel','They give it five stars. Elmira is moved.',{g:160,xp:80,rep:{town:1}}]]],
['woodworking',22,'The Whispering Willow',['In Moonlit Glade, a willow whispers advice. Mostly "the best bow is the one you don\'t draw."','Elmira weeps with joy. "It\'s never spoken to anyone."'],[['Listen carefully','The willow tells you where the best wood hides. You make a mental note.',{xp:120,it:[['willow_log',6]]}],['Ask for gossip','The willow whispers about a pine that "walks funny." Delightful.',{g:300,xp:100}]]],
['woodworking',30,'The Last Tree',['Elmira hands you a seedling. "I planted its mother when I was young. Plant this where the sun is kind."','You plant it behind the workshop. By morning, it\'s knee-high and slightly smug.'],[['Water it daily','The sapling grows quickly. Elmira smiles.',{xp:200,sp:1}],['Name it Dunstan Jr.','Dunstan objects. The tree seems pleased.',{xp:200,sp:1,rep:{guild:2}}]]],

['weaving',1,'Eight Hands Are Better',['Auntie Arachne Thistle works at her loom using all eight arms. "You\'ll learn," she says. "Start with two."','She hands you a needle. It is sharper than you expected.'],[['Practice a simple stitch','A crooked line of thread. "Beautiful," Arachne lies kindly.',{xp:30,cx:['weaving',40]}],['Ask about the extra arms','"Family tradition," she says, waving six of them.',{g:25,bless:['speed',8,20]}]]],
['weaving',8,'The Loom of Many Opinions',['The Loom speaks. It disapproves of your color choices. "Beige?" it says. "At your age?"','Auntie Arachne shrugs. "It has opinions."'],[['Accept its fashion advice','Your next piece is tasteful and bold. The Loom approves.',{xp:50,g:60}],['Argue with the Loom','The Loom sulks. A thread snaps. Arachne laughs.',{xp:60,it:[[CLOTH[2],2]]}]]],
['weaving',15,'A Gift of Silk',['A swarm of silkmoths asks for a favor: please stop wearing wool. It\'s embarrassing.','You consider, briefly, a world without wool.'],[['Agree to buy only silk','The moths cheer. Your wallet weeps.',{xp:70,rep:{town:1}}],['Offer a compromise','The moths accept "mixed fibers." They\'re practical.',{g:150,xp:70}]]],
['weaving',22,'The Cloak That Remembered Being a Cloud',['You weave a cloak so soft it remembers being a cloud. It tries to float away.','Arachne ties it to your wrist with string. "It\'ll settle."'],[['Wear it proudly','It rains on you gently, all day, in a flattering way.',{xp:120,bless:['luck',8,30]}],['Gift it to Madame Sorrel','She weeps, twirls, and tips like a duchess.',{g:380,xp:100}]]],
['weaving',30,'The Last Thread',['Arachne lays a spool of silver thread in your hand. "This is the last I spun. Weave something that matters."','It glows faintly, like a promise.'],[['Weave a banner for the town','The banner flies over the square for years.',{xp:200,sp:1,rep:{town:3}}],['Weave a scarf for Dunstan','He doesn\'t say thank you. He wears it every day.',{xp:200,sp:1}]]],

['jewelcrafting',1,'Shiny',['Fennick Glint, a magpie-person in a tiny waistcoat, hoards a quartz in each pocket. "Borrowed," he says. "Temporarily."','He is, you notice, wearing a ring that is, in fact, yours.'],[['Take your ring back','He hands it over with great dignity and a hidden wink.',{xp:30,cx:['jewelcrafting',40]}],['Let him keep it','Fennick is overwhelmed. He gives you a perfect little quartz.',{it:[['cutgem_1',2]],xp:25}]]],
['jewelcrafting',8,'The Case of the Missing Garnet',['A garnet goes missing. Everyone suspects Fennick. Fennick suspects everyone, including himself.','You find it in his nest, wrapped in a note: "I\'m sorry."'],[['Return it quietly','Fennick, greatly relieved, tips you in sparkly things.',{g:70,xp:50}],['Call a town meeting','The town agrees: a jewelry heist plot would be exciting. Fennick sinks into his waistcoat.',{xp:60,rep:{town:1}}]]],
['jewelcrafting',15,'Mirror, Mirror, Opinion',['A magic mirror offers to review your jewelry. "Gaudy," it says. "Tasteless. I love it."','Fennick tries to steal the mirror. It insults him until he gives up.'],[['Ask for an honest review','The mirror compliments your cutting technique and mocks your socks.',{xp:80,bless:['qual',6,20]}],['Sell the mirror to Madame Sorrel','She pays handsomely. The mirror weeps with joy.',{g:260,xp:70}]]],
['jewelcrafting',22,'The Crown Nobody Wanted',['The duchess commissions a crown, then changes her mind eleven times. You end up with a crown nobody wants.','Fennick eyes it hungrily. "I want it."'],[['Give it to Fennick','He wears it. It makes him look like a very small, very smug king.',{xp:130,rep:{guild:1}}],['Sell it to a collector','A collector pays absurdly well. You don\'t ask why.',{g:450,xp:100}]]],
['jewelcrafting',30,'Fennick\'s Hoard',['Fennick opens a hidden cache. Rings, gems, buttons, coins, and one very old, very ugly spoon.','"It\'s yours," he says. "Pick one."'],[['Pick the spoon','The spoon turns out to be the finest silver you\'ve ever seen.',{xp:220,sp:1,it:[['gold_ingot',4]]}],['Pick a ring','It fits like it was always yours.',{xp:220,sp:1,it:[['cutgem_6',2]]}]]],

['alchemy',1,'Rule Zero: Don\'t Sniff It',['Dr. Mortimer Fizzwick, whose eyebrows have been permanently removed by past experiments, hands you a beaker. "Rule zero: never, ever sniff it."','You sniff it. Your eyes water for a minute.'],[['Take notes','"Good habit," Fizzwick says. "Next time, with goggles."',{xp:30,cx:['alchemy',40]}],['Admit you sniffed it','He nods knowingly. "Everyone does."',{g:20,bless:['xp',8,20]}]]],
['alchemy',8,'Potion of Dubious Confidence',['Fizzwick unveils a pink potion. "Confidence in a bottle. Probably."','A volunteer drinks it and immediately attempts to fight a doorframe.'],[['Test it yourself','You feel invincible for ten minutes and then very, very sleepy.',{xp:50,bless:['luck',6,15]}],['Sell it as a novelty','The bard buys six. Chaos ensues.',{g:90,xp:40}]]],
['alchemy',15,'The Bubbling Corner Incident',['A beaker bubbles over. Then another. Then, in a feat of impossible chemistry, all of them.','Fizzwick calmly says: "Everyone out. Slowly. Quietly. With dignity."'],[['Mop up the mess','It takes two hours. The corner now glows slightly.',{xp:80,g:100}],['Study the reaction','You\'ve discovered a new, extremely unstable compound. Fizzwick is delighted.',{xp:110,cx:['alchemy',60]}]]],
['alchemy',22,'Philosopher\'s Pretzel',['Fizzwick bakes a pretzel that purportedly turns anything into itself. "Philosopher\'s Pretzel," he says reverently.','You take a bite. Nothing happens. Then everything tastes like pretzels.'],[['Share it with Gran Marrow','Gran declares it "delightfully weird" and demands the recipe.',{xp:120,rep:{guild:1}}],['Keep it for later','It tastes marginally worse. Philosophically.',{g:260,xp:100}]]],
['alchemy',30,'Fizzwick\'s Last Experiment',['Fizzwick unveils his final creation: a potion that does nothing at all. "My masterpiece," he says, misty-eyed.','You drink it. Nothing happens. It is the most relaxing nothing you\'ve ever experienced.'],[['Applaud him','Fizzwick sobs with joy. He bows so deeply his goggles fall off.',{xp:220,sp:1}],['Ask for the recipe','"Four parts water, one part hope." He winks.',{xp:220,sp:1,rep:{guild:2}}]]],

['cooking',1,'Everything Is Edible Once',['Gran Marrow, a retired adventurer with forearms like hams, stirs a pot. "Everything is edible once," she says. "Some things only once."','You decide not to ask which pot this is.'],[['Taste the stew','It is, against all odds, delicious. Gran nods approvingly.',{xp:30,cx:['cooking',40]}],['Offer to chop','You chop. She critiques. It\'s a bonding moment.',{g:25,bless:['gather',8,20]}]]],
['cooking',8,'The Taste of Fear',['Gran tells you about a monster she once cooked. "It tasted like regret. And a little like cinnamon."','The cooking pot rattles meaningfully.'],[['Ask for the recipe','"Don\'t," she says. "But here\'s the spice blend."',{xp:50,it:[['spice_mix',2]]}],['Cook something less terrifying','A comforting stew. Gran smiles.',{g:70,xp:40}]]],
['cooking',15,'Cooking for Monsters',['A very large, very hungry ogre arrives at your door. He says "please" in a small voice.','Gran hands you an apron. "Let\'s make him a feast."'],[['Cook a hearty meal','He cries into his bowl. Then asks for seconds.',{g:200,xp:80,rep:{town:2}}],['Teach him to cook','He learns quickly. You\'ve made a friend. Possibly a rival.',{xp:90,it:[['boar',4]]}]]],
['cooking',22,'Stew of Ages',['Gran has kept a stew going for forty years. "Never finished," she says. "That\'s the secret."','You taste it. It tastes like every meal you\'ve ever loved.'],[['Add a secret ingredient','Salt. You add salt. Gran nods once.',{xp:130,bless:['xp',15,30]}],['Take notes','Her recipe is mostly "taste and adjust." Useful.',{g:300,xp:110}]]],
['cooking',30,'Gran\'s Recipe',['Gran hands you a worn, stained, gravy-spattered recipe card. "That\'s the only one I ever wrote down."','It says: "Cook with love. Add more butter."'],[['Frame it','It hangs in the kitchen, forever.',{xp:220,sp:1}],['Cook it that night','The meal is perfect. Gran weeps. So does Dunstan, quietly.',{xp:220,sp:1,rep:{town:2}}]]],

['arcane',1,'I Forgot What I Was Going To Teach You',['Archmage Ottoline Vex stares at you for a long moment. "I had a lesson planned. I\'ve forgotten it."','She conjures a small, bewildered candle.'],[['Offer to help her remember','She smiles. "That\'s kind. I\'ll teach you a rune instead."',{xp:30,cx:['arcane',40]}],['Suggest tea','She adores tea. She forgets what she wanted to say, but the tea is lovely.',{g:20,bless:['qual',3,20]}]]],
['arcane',8,'The Spell That Did Something',['Ottoline casts a spell. Something happens. Nobody is sure what.','"It was probably useful," she says cheerfully.'],[['Investigate','You discover a faint residue of glitter and regret.',{xp:50,it:[['arcane_dust',4]]}],['Ask her to cast it again','She tries. The chair becomes a different chair. Progress.',{g:70,xp:40}]]],
['arcane',15,'Mildly Dangerous Runes',['Ottoline unveils a rune labeled "Mildly Dangerous." It hums angrily.','"It\'s fine," she says. "Mostly."'],[['Study the rune','It reveals a pattern that boosts your focus.',{xp:90,bless:['qual',6,25]}],['Dispose of it carefully','A small explosion. Ottoline claps. "Mild!"',{g:150,xp:70}]]],
['arcane',22,'The Tower That Moved',['Ottoline\'s tower has moved three feet east. She notices. "Huh."','Within the hour, it has moved back, with a smug creak.'],[['Offer to anchor it','She accepts a rune of staying put. The tower is displeased.',{xp:130,g:200}],['Ride it for fun','The tower takes you on a surprisingly gentle tour of the valley.',{xp:140,rep:{town:2}}]]],
['arcane',30,'Ottoline Remembers',['Ottoline stands very still. "I remember," she says. "I remember everything. It\'s awful."','She smiles. "And wonderful."'],[['Hug her','She is very small and very warm. She forgets, again, but the hug stays.',{xp:220,sp:1}],['Ask what she remembers','A long, wonderful story about a girl, a tower, and a very kind dragon.',{xp:220,sp:1,rep:{guild:2}}]]],

['tinkering',1,'It Might Explode',['Nib Cogsworth, a goblin with a toolbelt bigger than he is, hands you a gizmo. "It might explode. Probably not."','You hold it very carefully.'],[['Press the button','It plays a short, cheerful tune. Nib is thrilled.',{xp:30,cx:['tinkering',40]}],['Put it down gently','Nib looks a little disappointed. You feel responsible.',{g:25,bless:['speed',8,20]}]]],
['tinkering',8,'Clockwork Duck Uprising',['The clockwork ducks have organized. They demand better working conditions and, for some reason, bread.','Nib, to his credit, listens.'],[['Negotiate','The ducks accept a modest bread subsidy.',{xp:50,g:70}],['Reprogram them','The ducks now only quack at dawn. Progress.',{xp:60,it:[[GEAR[2],4]]}]]],
['tinkering',15,'The Self-Stirring Spoon Problem',['Nib\'s newest invention is a spoon that stirs by itself. It will not stop.','"It\'s been stirring for six days," he says. "The soup is very well-mixed."'],[['Disable it','You find the off switch. It was labeled "off." Nib is mortified.',{xp:80,g:120}],['Let it stir forever','It becomes the town\'s most dedicated cook. Gran is jealous.',{xp:100,rep:{town:1}}]]],
['tinkering',22,'Nib\'s Wonderfully Terrible Idea',['Nib has a plan: a flying anvil. He\'s very proud of it. He\'s very wrong.','Dunstan, from his corner, says only: "No."'],[['Back Nib\'s idea','It flies. For roughly four seconds. Then plummets with grace.',{xp:130,g:300}],['Suggest a safer design','Nib scribbles furiously. "Brilliant. Terrible. Brilliant."',{xp:140,bless:['xp',15,30]}]]],
['tinkering',30,'The Last Gear',['Nib presses a single, perfect gear into your hand. "It\'s the first thing I ever made that worked."','He looks at it with an expression you will remember forever.'],[['Keep it in your pocket','It ticks softly, like a tiny heart.',{xp:220,sp:1}],['Install it in the workshop','The whole workshop hums. It has never felt more alive.',{xp:220,sp:1,rep:{guild:2}}]]]
];
var TALES=TALES_RAW.map(function(t){return {id:'tale_'+t[0]+'_'+t[1],craft:t[0],lv:t[1],title:t[2],p:t[3],ch:t[4]};});
var TALE_BY={};TALES.forEach(function(t){TALE_BY[t.id]=t;});
'use strict';
/* ===== MORE MENTOR TALES (levels 38 and 45) ===== */
(function(){
var T=[
['smelting',38,'Gladys Wants a Raise',['Gladys, the furnace, has begun speaking in complete sentences. Pip is delighted and also frightened.','"I would like a window," she says. "And a better class of coal."'],[['Install a window','Gladys watches the sunrise for the first time. She is quiet for a long while.',{g:900,cx:['smelting',200]}],['Negotiate for premium coal','She accepts a barrel of the good stuff and promises not to unionize.',{it:[['coal',20],[INGOT[6],4]],xp:300}]]],
['smelting',45,'The Heat Death of Gladys',['Gladys announces she is the last honest fire in the world and plans to burn forever. Pip weeps.','You realize "forever" is a lot of coal.'],[['Promise to tend her','You pledge to keep her lit. She hums. The workshop is warm for a hundred years.',{xp:900,sp:1}],['Teach her to rest','Gladys learns banked embers. It is the most peaceful thing you\'ve ever seen.',{xp:900,sp:1,rep:{guild:3}}]]],
['smithing',38,'The Sword Who Wanted to Be a Plow',['A blade you forged confesses it would prefer farming. "I have a gentle soul," it says.','Hildy folds her arms. "Hit it harder."'],[['Retrain it as a plow','Farmer Hale is thrilled. The sword is happier than any sword in history.',{g:1200,xp:350}],['Insist it fight','It does. It is bad at it. It is also, somehow, inspirational.',{cx:['smithing',220],rep:{town:2}}]]],
['smithing',45,'Hildy and the Last Anvil',['Hildy hammers a single strike so perfect the whole valley hears it.','"That," she says, "is what we have been doing all this time."'],[['Match her strike','Yours rings a half-note lower. Together, they make a chord.',{xp:1000,sp:1}],['Just listen','You close your eyes. Dunstan does too. The silence afterward is holy.',{xp:1000,sp:1,rep:{guild:3}}]]],
['armoring',38,'The Armor That Apologized',['A suit of plate you forged keeps apologizing to everyone it protects. "Sorry," it clanks. "Sorry for blocking that."','Bartleby, deeply moved, takes notes.'],[['Reassure the armor','"You\'re doing great," you say. The armor sniffles, rattling.',{xp:350,g:1000}],['Enchant it to stop','Ottoline obliges. The armor is silent, but sometimes you catch it mouthing "sorry."',{cx:['armoring',220],it:[['arcane_dust',20]]}]]],
['armoring',45,'Sir Bartleby\'s Real Name',['Bartleby finally removes his gauntlet. "My name isn\'t Dent," he says. "It\'s Barnaby. The dents came later."','He looks at you, expectant, a little scared.'],[['"Barnaby suits you."','He beams. The whole workshop feels a little less dented.',{xp:1000,sp:1}],['"Dent suits you more."','He laughs until his helm fogs. Neither name leaves him again.',{xp:1000,sp:1,rep:{town:3}}]]],
['woodworking',38,'The Tree That Learned to Walk',['In the canopy, a sapling you planted has taken to following you. Elmira calls it "Sir Wiggles."','It is, undeniably, a very good tree.'],[['Let it follow you','It sits outside the shop, providing shade and mild menace.',{xp:350,rep:{town:2}}],['Plant it somewhere safe','It sulks, then roots with great dignity. The grove thrives.',{g:1100,it:[['sky_log',8]]}]]],
['woodworking',45,'Elmira\'s Forest',['Elmira leads you into a grove she has been planting for fifty years. Every tree is labeled with a name.','"Each one," she says, "was a promise."'],[['Name a tree','You pick a small oak and call it Dunstan II. He pretends not to care.',{xp:1000,sp:1}],['Plant a tree','Your hands in the dirt. The sapling does not complain. It just grows.',{xp:1000,sp:1,rep:{guild:3}}]]],
['weaving',38,'The Pillow Rebellion',['The enchanted pillows have organized. They demand fewer naps and more purpose.','Arachne is thrilled. "Finally," she says, "ambition."'],[['Grant them a charter','The pillows form a guild. They are very soft, very serious.',{xp:350,g:1000}],['Offer them jobs','Each pillow is assigned to a bench. Productivity rises. Comfort rises more.',{cx:['weaving',220],bless:['xp',20,20]}]]],
['weaving',45,'The Last Spool',['Arachne unspools a thread so long it loops the valley and returns. "Every life is one thread," she says. "Yours is looking sturdy."','She snips it. A tiny bell rings somewhere.'],[['Tie it to your wrist','It hums when you work. It hums louder when you\'re right.',{xp:1000,sp:1}],['Tie it to Dunstan','He grumbles. The thread glows. He doesn\'t remove it.',{xp:1000,sp:1,rep:{guild:3}}]]],
['jewelcrafting',38,'Fennick\'s Honest Day',['Fennick has gone twenty-four hours without stealing. He is trembling. He is also glowing, faintly.','"I think," he whispers, "I\'m growing as a person."'],[['Throw him a party','Everyone brings sparkly gifts. Fennick sobs. Several gifts are suspiciously his.',{xp:350,g:1000}],['Check your pockets','Everything\'s there. He lets out a breath he\'s been holding since morning.',{cx:['jewelcrafting',220],rep:{town:2}}]]],
['jewelcrafting',45,'The Gem That Wouldn\'t Shine',['A gem arrives that refuses to catch light. Fennick tuts. "Needs love."','You hold it. It warms. And then, softly, it glows from the inside.'],[['Set it in your tool','It becomes the quiet center of everything you make.',{xp:1000,sp:1}],['Give it back to Fennick','He nearly faints. He calls it "Hope." It sits in his nest, glowing.',{xp:1000,sp:1,rep:{guild:3}}]]],
['alchemy',38,'Fizzwick\'s Eyebrows Return',['Fizzwick\'s eyebrows grow back, overnight, in full. He looks like an owl who has seen things.','"I\'m afraid to blink," he whispers.'],[['Reassure him','He blinks. Nothing happens. He laughs for ten minutes.',{xp:350,g:1100}],['Dare him to experiment','They vanish again. He grins. "Worth it."',{cx:['alchemy',220],bless:['qual',10,20]}]]],
['alchemy',45,'The Elixir of Okay',['Fizzwick unveils a tiny vial. "It makes you feel okay," he says. "Not great. Not terrible. Okay."','"It\'s the hardest potion I\'ve ever made."'],[['Drink it','You feel okay. It is, truly, a wonderful thing to feel.',{xp:1000,sp:1}],['Share it with Debbie\'s favorite neighbor','The whole street is slightly more okay for a week.',{xp:1000,sp:1,rep:{town:3}}]]],
['cooking',38,'The Monster Who Came to Dinner',['A dragon intern arrives, sheepish, with a note: "Vesperax says you cook acceptably. I need to learn."','Gran rolls up her sleeves. "Sit."'],[['Teach her basics','She burns three eggs. Then she makes a perfect omelette and cries.',{xp:350,g:1200}],['Teach her fire control','The kitchen is on fire. It is a good kind of fire.',{cx:['cooking',220],rep:{guild:2}}]]],
['cooking',45,'Gran\'s Last Dinner Party',['Gran sets a table for everyone: Pip, Hildy, Bartleby, Elmira, Arachne, Fennick, Fizzwick, Ottoline, Nib, and Dunstan.','"I cooked everything I\'ve ever learned," she says. "Eat."'],[['Raise a toast','"To Billie," you say. The table echoes it. Someone sniffles loudly.',{xp:1000,sp:1}],['Serve seconds','You pass dishes until everyone\'s too full to move. Gran grins.',{xp:1000,sp:1,rep:{town:3}}]]],
['arcane',38,'Ottoline\'s Nap',['Ottoline falls asleep mid-spell. The spell keeps going. It is writing a very long letter to nobody.','The letter says "Dear Tomorrow."'],[['Wake her gently','"Hm? Oh, hello. I was dreaming of tea."',{xp:350,g:1100}],['Read the letter','It is a list of everything she\'s afraid to forget. You\'re quiet for a while.',{cx:['arcane',220],rep:{guild:2}}]]],
['arcane',45,'The Spell Without a Name',['Ottoline whispers a spell. It has no name, no sigil, no light. It just makes the room feel kind.','"That," she says, "is the only magic that matters."'],[['Learn it','You practice. It never works exactly twice. It never has to.',{xp:1000,sp:1}],['Cast it on Dunstan','He says nothing for a very long time. Then: "Thank you."',{xp:1000,sp:1,rep:{guild:3}}]]],
['tinkering',38,'Nib\'s Terrifying Success',['Nib\'s newest invention works. All of it. On the first try.','He stares at it in horror. "Something is wrong."'],[['Test it','It runs perfectly. Nib faints. Dunstan says, "I\'ll allow it."',{xp:350,g:1200}],['Introduce a flaw','Nib breathes again. Everything feels right.',{cx:['tinkering',220],bless:['speed',25,20]}]]],
['tinkering',45,'The Final Blueprint',['Nib hands you a blueprint. It is one page. It says: "Make something you love."','He shrugs. "That\'s the whole trick."'],[['Frame it','It hangs above your bench. You read it every morning.',{xp:1000,sp:1}],['Start building','You do. Nib watches, vibrating with pride.',{xp:1000,sp:1,rep:{guild:3}}]]]
];

})();

/* ===== ACT II: THE UNFINISHED ===== */
(function(){
var S2=[
{id:'ch14',title:'The Heap Stirs',icon:'🗑️',when:{after:'epilogue',lv:48},nodes:{
start:{p:['Something is walking up Main Street. It is made of broken buckets, cracked shields, snapped swords, and one extremely disappointed rocking horse.','>Heap Golem|I... have... warranty.','>Dunstan|Oh no. Oh, <i>no</i>. I know what this is.','Townsfolk scatter. Mayor Hobbs hides in a barrel. The goose, to its credit, holds the line.'],
 c:[{t:'Stop it with force (Might)',chk:{s:'might',dc:48,ok:'smash',fail:'tangle'}},{t:'Look it over carefully (Finesse)',chk:{s:'finesse',dc:48,ok:'mend',fail:'tangle'}},{t:'Talk to it (Charm)',chk:{s:'charm',dc:48,ok:'talk',fail:'tangle'}}]},
smash:{p:['You stop it with one clean blow. It comes apart into a hundred pieces. Each piece quietly whimpers.','>Dunstan|...That felt wrong. Why did that feel wrong?'],c:[{t:'Sweep up the pieces',end:true,fx:{xp:1200,g:600,fl:'heap_known',rep:{town:2}}}]},
mend:{p:['You find the loose rivet in its chest and tighten it. It sighs. The whole golem relaxes like a dog being scratched.','>Heap Golem|Thank... you.'],c:[{t:'Ask where it came from',end:true,fx:{xp:1500,g:800,fl:'heap_known',rep:{town:3,guild:2}}}]},
talk:{p:['"What\'s your name?" you ask. It pauses, as if no one ever has.','>Heap Golem|Nobody... asked.','It sits down in the road. It is, suddenly, very small.'],c:[{t:'Sit with it',end:true,fx:{xp:1500,g:500,fl:'heap_known',rep:{town:4,guild:1}}}]},
tangle:{p:['You get tangled in a net of old chains. The golem walks off, politely apologizing. It leaves a very clear trail of rust toward the marsh.'],c:[{t:'Follow the rust',end:true,fx:{xp:900,fl:'heap_known'}}]}}},

{id:'ch15',title:'Calla\'s Confession',icon:'🛡️',when:{after:'ch14',lv:51},nodes:{
start:{p:['Calla Brightforge stands at your door. No armor. No polish. A single bag. She looks like she has not slept.','>Calla|The Concord is gone. Gildenhoard is sweeping. But the Planned Obsolescence Division kept running. By itself. It\'s a ledger. It has been writing orders.','>Calla|It writes every product to fail at a set time. And it\'s <i>sending them somewhere.</i>','>Dunstan|The Heap. It\'s feeding the Heap.','>Calla|I need your help. I\'m... sorry.'],
 c:[{t:'"Welcome back."',go:'warm'},{t:'Test her sincerity (Wits)',chk:{s:'wits',dc:55,ok:'sincere',fail:'warm'}},{t:'"Prove it."',go:'prove'}]},
warm:{p:['She exhales like someone who has been holding a very heavy bag. "Thank you. I won\'t waste it."'],c:[{t:'Hand her an apron',end:true,fx:{xp:1500,rep:{guild:3,town:2},fl:'calla_ally',it:[['dunstan_charm',1]]}}]},
sincere:{p:['You ask three oddly specific questions. Her answers are crooked, honest, and a little embarrassing. You believe her completely.','>Dunstan|She\'s telling the truth. And she hates it. A good sign.'],c:[{t:'Hand her an apron',end:true,fx:{xp:1800,rep:{guild:4,town:2},fl:'calla_ally'}}]},
prove:{p:['Calla goes to the forge and makes a single, flawed, utterly human dagger. She presents it.','>Calla|It\'s not perfect.','>Dunstan|That\'s the point.'],c:[{t:'Accept her',end:true,fx:{xp:1700,rep:{guild:3},fl:'calla_ally',g:900}}]}}},

{id:'ch16',title:'Seven Stations, Seven Seals',icon:'🔒',when:{after:'ch15',lv:54,marks:7},nodes:{
start:{p:['In the vault, the tome you ignored for years finally opens. The ink glows.','>Dunstan|The Seven Stations aren\'t just workbenches. They are <i>seals</i>. Every station you upgrade, every Mark you earn, tightens a lock on something very old.','>Dunstan|The Heap. The Unfinished. A thing made of everything ever badly made and thrown away. We\'ve kept it asleep for thirty years without knowing.','>Dunstan|It\'s waking up because someone is feeding it. Hurt things are loud, Spark.'],
 c:[{t:'Reinforce the seals through craftsmanship',go:'craft'},{t:'Reinforce them with story (Charm)',chk:{s:'charm',dc:60,ok:'story',fail:'craft'}},{t:'Ask Dunstan for a plan',go:'plan'}]},
craft:{p:['You spend the night making every seal piece by hand. By dawn the stations glow steady and warm.'],c:[{t:'Rest',end:true,fx:{xp:2000,sp:1,rep:{guild:3},fl:'seals_known'}}]},
story:{p:['You tell the stations, one by one, what each of them means to you. Each answers with a brighter hum. By morning, the Guild feels less like a place and more like a promise.'],c:[{t:'Rest',end:true,fx:{xp:2200,sp:1,rep:{guild:4,town:2},fl:'seals_known'}}]},
plan:{p:['>Dunstan|The plan is: keep making good things. It is, historically, the plan.','>Dunstan|Also: don\'t panic. Panic burns coal.'],c:[{t:'Keep calm',end:true,fx:{xp:1800,sp:1,fl:'seals_known'}}]}}},

{id:'ch17',title:'The Dragon\'s Hoard Goes Missing',icon:'🐲',when:{after:'ch16',lv:57},nodes:{
start:{p:['Vesperax lands in your yard hard enough to scatter the chickens.','>Vesperax|My hoard is gone. Nine hundred years of the finest things mortals ever made. Gone. In one night.','>Dunstan|The golems. They\'re taking the masterworks to the Heap. They want to <i>finish</i> them.','>Vesperax|Tell me where they went. I will remove it from the world.','>Dunstan|(whisper) Spark, <i>please</i> be the reasonable one.'],
 c:[{t:'Propose a sneaky recovery (Finesse)',chk:{s:'finesse',dc:62,ok:'sneak',fail:'fire'}},{t:'Propose a diplomatic recovery (Charm)',chk:{s:'charm',dc:62,ok:'talk',fail:'fire'}},{t:'Let her burn it (Might)',chk:{s:'might',dc:62,ok:'fire',fail:'fire'}}]},
sneak:{p:['You and Vesperax creep through a corridor of rusty shields. She is astonishingly bad at sneaking. She is also astonishingly proud.','You recover half the hoard unnoticed.'],c:[{t:'Escape',end:true,fx:{xp:2500,g:3000,rep:{guild:3},fl:'hoard_half'}}]},
talk:{p:['You speak to the golems. They are, it turns out, very lonely. They hand over the hoard politely and ask whether they may keep one spoon.','>Vesperax|...Let them.'],c:[{t:'Return the hoard',end:true,fx:{xp:3000,g:2000,rep:{guild:3,town:3},fl:'hoard_back'}}]},
fire:{p:['Fire is applied liberally. The corridor becomes less a corridor and more a theory. Vesperax is delighted. The Heap is, somewhere, deeply offended.'],c:[{t:'Retreat',end:true,fx:{xp:1800,g:1000,rep:{concord:2},fl:'hoard_burnt'}}]}}},

{id:'ch18',title:'A Guild Reborn',icon:'🏛️',when:{after:'ch17',lv:60},nodes:{
start:{p:['Word spreads. Smiths, weavers, cooks, tinkerers, and one very confused bard show up at the Crooked Crucible asking to join.','>Dunstan|We need a creed. The old Guild had one. It was long, dull, and had a lot of clauses.','>Dunstan|What does the Hallowed Guild stand for, Spark?'],
 c:[{t:'"Quality above all."',go:'q'},{t:'"Community first."',go:'c'},{t:'"Curiosity, always."',go:'k'}]},
q:{p:['The creed is carved over the door: <i>"Make it well."</i> It\'s short. It sticks.'],c:[{t:'Sign the charter',end:true,fx:{xp:3000,sp:1,rep:{guild:5},fl:'creed_quality',bless:['qual',15,60],title:'Guildmaster'}}]},
c:{p:['The creed is carved over the door: <i>"Nobody builds alone."</i> A goose adds a footnote.'],c:[{t:'Sign the charter',end:true,fx:{xp:3000,sp:1,rep:{town:5},fl:'creed_community',bless:['xp',20,60],title:'Guildmaster'}}]},
k:{p:['The creed is carved over the door: <i>"Try the strange thing."</i> Ottoline adds three exclamation points. They fade instantly.'],c:[{t:'Sign the charter',end:true,fx:{xp:3000,sp:1,rep:{guild:3,town:2},fl:'creed_curiosity',bless:['luck',12,60],title:'Guildmaster'}}]}}},

{id:'ch19',title:'The Seven Relics',icon:'🏺',when:{after:'ch18',lv:63},nodes:{
start:{p:['>Dunstan|There\'s one more secret. Billie told me once. The old Guild left behind seven Relics. Objects so well made they became <i>something else</i>.','>Dunstan|They\'re scattered as fragments across the world. Find them. Forge them. They\'ll give you what no one else has.','>Dunstan|It will be hard. It will be, frankly, ridiculous. Some of those fragments might take weeks.','>Dunstan|But you\'ll be the first in a thousand years to do it.'],
 c:[{t:'Open the Relic Forge (Hero tab → Relics)',end:true,fx:{xp:2500,sp:1,fl:'relics_known'}}]}}},

{id:'ch20',title:'Gerald Gets Serious',icon:'🌫️',when:{after:'ch19',lv:66},nodes:{
start:{p:['The fog in the Marsh has been called Gerald for generations. It turns out Gerald is real. Gerald is also, apparently, a noble spirit of the old world.','>Gerald|Greetings. I have been watching. I would like a hat.','>Dunstan|...A hat?','>Gerald|The Heap\'s advance is upon us. I will aid you. I require a hat. A good one. I have been without for six centuries.'],
 c:[{t:'Craft Gerald a hat (Finesse)',chk:{s:'finesse',dc:68,ok:'hat',fail:'badhat'}},{t:'Gift him a borrowed hat',go:'borrowed'}]},
hat:{p:['You craft a hat of astonishing taste. Gerald weeps, mistily. The fog around him takes on the shape of a shy bow.','>Gerald|I shall defend your town.'],c:[{t:'Put it on Gerald',end:true,fx:{xp:3000,rep:{town:3},fl:'gerald_ally',bless:['gather',25,60]}}]},
badhat:{p:['The hat is lopsided. Gerald loves it anyway. He wears it like a crown.','>Gerald|Perfect imperfection.'],c:[{t:'Accept the praise',end:true,fx:{xp:2200,rep:{town:2},fl:'gerald_ally'}}]},
borrowed:{p:['Mayor Hobbs\'s hat. Gerald is delighted. Mayor Hobbs is, it must be said, less so.','>Mayor Hobbs|It\'s... a good cause.'],c:[{t:'Smile',end:true,fx:{xp:2000,rep:{town:1},fl:'gerald_ally'}}]}}},

{id:'ch21',title:'The Heap Speaks',icon:'🗑️',when:{after:'ch20',lv:69},nodes:{
start:{p:['You stand at the edge of the Heap. It is bigger than a town. It is quiet, in the way an abandoned room is quiet.','Then a million small voices say, together:','>The Heap|Why. Was. I. Thrown. Away.','>Dunstan|It\'s not a monster, Spark. It\'s a <i>question.</i>'],
 c:[{t:'"You weren\'t. Not by me."',go:'soft'},{t:'"Because someone was greedy, not because you were bad." (Charm)',chk:{s:'charm',dc:75,ok:'truth',fail:'soft'}},{t:'"Tell me what you were meant to be."',go:'ask'}]},
soft:{p:['The Heap shudders. A few pieces peel off, shy, and hover near you. They are very small. They are very quiet.'],c:[{t:'Hold out a hand',end:true,fx:{xp:3500,rep:{town:3,guild:3},fl:'heap_heard'}}]},
truth:{p:['The silence afterward is long. Then something enormous exhales, and the whole Heap loosens like a clenched fist.','>The Heap|...Oh.'],c:[{t:'Stay with it',end:true,fx:{xp:4500,rep:{town:4,guild:4},fl:'heap_heard',sp:1}}]},
ask:{p:['One piece after another speaks: a fork that wanted to hold a feast, a boot that wanted to walk a hundred miles, a sword that wanted to be a plow.','You listen to all of them. It takes three hours.'],c:[{t:'Remember them',end:true,fx:{xp:4200,rep:{guild:5},fl:'heap_heard'}}]}}},

{id:'ch22',title:'Siege of Tinderbury',icon:'🏰',when:{after:'ch21',lv:72},nodes:{
start:{p:['Gildenhoard\'s ledger, still running, triggers a final order: <i>"Failure at maximum scale."</i> The Heap lurches toward Tinderbury, confused and frightened and enormous.','The town gathers. Hildy raises a hammer. Bartleby raises a shield. Gran raises a ladle. Gerald raises his hat. The goose raises, well, the goose.','>Dunstan|It doesn\'t want to hurt anyone. It\'s following a bad order. We need to stop the order, not the Heap.'],
 c:[{t:'Hold the gate (Grit)',chk:{s:'grit',dc:80,ok:'hold',fail:'break'}},{t:'Rally the guild (Charm)',chk:{s:'charm',dc:80,ok:'rally',fail:'break'}},{t:'Find the ledger (Wits)',chk:{s:'wits',dc:80,ok:'ledger',fail:'break'}}]},
hold:{p:['You plant your feet. The Heap\'s first wave breaks on you like a tide on a lighthouse. You do not move.'],c:[{t:'Hold on',end:true,fx:{xp:5000,g:4000,rep:{town:5},fl:'siege_held'}}]},
rally:{p:['Every guild member shows up. A hundred smiths, cooks, weavers and tinkerers form a line, each holding something they made. The Heap stops. It looks at the line. It, very slowly, lowers itself.'],c:[{t:'Hold the line',end:true,fx:{xp:5500,g:3000,rep:{town:5,guild:5},fl:'siege_held'}}]},
ledger:{p:['You find the ledger in an alley, still scribbling failure dates. You close the cover, gently. The scribbling stops. A hundred thousand items sigh, as if someone has finally let go of a breath.'],c:[{t:'Burn the ledger',end:true,fx:{xp:6000,g:2000,rep:{guild:5},fl:'siege_held'}}]},
break:{p:['The line breaks. The Heap pours through, stumbling, a flood of rust and apology. Gerald wraps the town in fog and it staggers harmlessly through.','Tinderbury is rattled but intact. Everyone is a little closer afterward.'],c:[{t:'Regroup',end:true,fx:{xp:3500,g:500,rep:{town:2},fl:'siege_held'}}]}}},

{id:'ch23',title:'Dunstan\'s Choice',icon:'anvil',when:{after:'ch22',lv:75},nodes:{
start:{p:['The Heap has settled outside town, waiting. Dunstan is very quiet.','>Dunstan|The seals can be made permanent. The Hallowed Guild\'s last trick. It needs an anvil, and a human to hold it, forever.','>Dunstan|I could go back. I could be the seal.','>Dunstan|I\'m not saying I want to. I\'m saying it would work.'],
 c:[{t:'"No. We find another way."',go:'no'},{t:'"You\'ve done enough, Dunstan."',go:'enough'},{t:'"Then we mend the Heap instead."',go:'mend'}]},
no:{p:['>Dunstan|...Good. I was hoping you\'d say that. I\'m not <i>that</i> brave.'],c:[{t:'Plan the Mending',go:'plan'}]},
enough:{p:['>Dunstan|Spark, I\'ve been an anvil for thirty years. I\'m not done. Not by a long shot.'],c:[{t:'Plan the Mending',go:'plan'}]},
mend:{p:['>Dunstan|You mean — don\'t seal it. <i>Fix</i> it. That\'s... never been tried. That\'s either brilliant or catastrophic.','>Dunstan|Let\'s try it.'],c:[{t:'Plan the Mending',go:'plan'}]},
plan:{p:['>Dunstan|To mend something that big, we need eight masterworks. One from each of the great crafts, each made by you, each worthy of being a part of something that lasts.','>Dunstan|Eternium-grade. No shortcuts.','>Dunstan|And then, we do it. Together.'],c:[{t:'Accept the Mending',end:true,fx:{trial:'mending',xp:3500}}]}}},

{id:'ch24',title:'The Mending',icon:'🧵',when:{trial:'mending'},nodes:{
start:{p:['You lay out the eight masterworks on the Heap\'s edge. They shine. The Heap looks at them for a very long time.','>The Heap|What... are they?','>Dunstan|Things that were made to be kept.','>The Heap|...Can I be one?','Your throat tightens. All around you, the mentors gather. Nobody speaks.'],
 c:[{t:'"What do you want to become?"',go:'ask'},{t:'"You already are."',go:'are'}]},
ask:{p:['The Heap thinks. Pieces rattle. A thousand voices argue. Eventually, one answer rises above the noise.','>The Heap|A library. A place where nothing is thrown away.'],c:[{t:'Begin the Mending',go:'mend'}]},
are:{p:['>The Heap|...I am?','>Dunstan|You were always. You just needed someone to say it.'],c:[{t:'Begin the Mending',go:'mend'}]},
mend:{p:['You and the guild work through the night. Hildy hammers. Arachne weaves. Fizzwick brews the glue. Gran feeds everyone. Ottoline remembers the spells.','By dawn, the Heap is a library. A vast, strange, lovely place of mismatched shelves and kind lamps. Every broken thing has a place. Every forgotten thing has a home.'],c:[{t:'Step inside',end:true,fx:{xp:8000,sp:2,rep:{town:5,guild:5},fl:'heap_mended',it:[['heartfire_blade',0]]}}]}}},

{id:'ch25',title:'The Last Anvil',icon:'🔥',when:{after:'ch24',lv:80},nodes:{
start:{p:['A year after the Mending, the Library of the Unfinished is the most visited place in the world. Pilgrims come to leave broken things and take away mended ones.','Tinderbury is a city now, or something like it. The Crooked Crucible is still crooked. You made sure of it.','Dunstan stands beside you, human, tired, and happier than you\'ve ever seen him.','>Dunstan|I have a confession. I think I like being a person.','>Dunstan|But I also think I\'d like to keep being an anvil, sometimes. It\'s restful.'],
 c:[{t:'"You can be both."',go:'both'},{t:'"You\'ve earned a long break."',go:'break'},{t:'"I\'m glad you\'re here."',go:'glad'}]},
both:{p:['He grins. "Excellent. I\'ll take the mornings as an anvil. Afternoons as a man. Evenings as a menace."'],c:[{t:'Light the forge',go:'end'}]},
break:{p:['"A break?" He laughs. "Spark, I\'ve been waiting thirty years to be bored. Let me be bored for a decade."'],c:[{t:'Light the forge',go:'end'}]},
glad:{p:['He looks at the ground for a moment. "So am I. More than I can say."'],c:[{t:'Light the forge',go:'end'}]},
end:{p:['The fire catches. The crooked crucible swings. Somewhere in the distance, a dragon sneezes, delighted.','Billie\'s letter, framed over the door, seems to glow faintly.','>Dunstan|One more thing, Spark. Billie left a postscript.','>Dunstan|"P.P.S. Make things that outlast you. Then be unbearable about it."','You laugh. Then you pick up the hammer.'],c:[{t:'Make something wonderful',end:true,fx:{xp:10000,sp:3,fl:'act2_done',title:'Last Anvil of Tinderbury',rep:{town:10,guild:10},ren:200}}]}}}
];
S2.forEach(function(s){STORY.push(s);STORY_BY[s.id]=s;});

/* ===== ENDGAME STORY: Act III — The Unfinished ===== */
(function(){
var S3=[
{id:'e1',title:'A Door in the Library',icon:'🚪',when:{after:'ch25',lv:66},goal:null,nodes:{
start:{p:['A year after the Mending, the Library of the Unfinished has a visitor nobody invited: a door. Tall, charred, humming softly in a wall that was solid yesterday.','>Calla|It wasn\'t on any plan. I checked. Gildenhoard\'s ledger has an entry, though — <i>"Contingency: if all else is finished, begin Project Unmaking."</i>','>Dunstan|The Ashen Gate. The old Guild sealed what\'s behind it. Everything we ever left half-done, hammered into one furious <i>thing</i>. It was waiting for someone to finish enough of the world that it could finally be… the odd one out.','>Dunstan|Spark, this is the endgame. Three new zones of monsters beyond the Gate: the <b>Ashen Gate</b>, the <b>Hollow Throne</b> and the <b>Heart of the Unfinished</b>. None of the creatures there are gentle. Nothing out there drops anything you can gather in a meadow.'],
 c:[{t:'"What do we need?"',go:'need'}]},
need:{p:['>Dunstan|Three things. One: <b>gear</b>. The Gate checks your Gear Score at the threshold; arrive underdressed and it just… declines. Hunt tab, check the numbers.','>Dunstan|Two: <b>new tiers</b>. Voidsteel (IX), Starforged (X), Primordial (XI). Ores, hides, gems and herbs for them come <i>only</i> from monsters beyond the Gate. Bosses drop <b>Cores</b> — every weapon, armor piece, ring and tool of those tiers needs one. Your crafts now go to level 60, and your stations to level 10.','>Dunstan|Three: <b>friends</b>. Bring food. Bring potions. Bring a plan. Match your weapon to the foe, wear wards against their element, and don\'t be proud about guarding.'],
 c:[{t:'"Then let\'s go open the door."',end:true,fx:{xp:5000,sp:1,fl:'endgame_open'}}]}}},

{id:'e2',title:'The Warden of Ash',icon:'👹',when:{after:'e1',st:{boss_ashengate:1}},nodes:{
start:{p:['The Warden of Ash hits the floor like a falling cathedral. Ash drifts upward, glowing, spelling something you can\'t quite read.','>The Warden|…Did you… finish it?','>Dunstan|Finish what?','>The Warden|Anything. Everything. I was the first thing the Guild built to guard the Unfinished. They never gave me a reason. Just a post. I held it for nine hundred years. It is… very tiring… to guard a thing with no ending.','>The Warden|Take my Core. It is Voidsteel. It will make you something to stand against the Throne. And… when you meet it… tell it that I stopped.'],
 c:[{t:'"I will."',go:'after'},{t:'"Rest now."',go:'after'}]},
after:{p:['The ash settles. Where the Warden fell lies a dull, heavy Core, still warm.','>Dunstan|That\'s the key. Cores for Voidsteel, then Starforged, then Primordial: bosses only. You\'ll need many. The Warden respawns in the Gate as the Gate remakes itself — grim, but good for business.','>Dunstan|Next: craft yourself something in Voidsteel. See how it feels.'],c:[{t:'Take the Core',end:true,fx:{xp:8000,sp:1,g:20000,title:'Warden-Breaker'}}]}}},

{id:'e3',title:'Voidsteel Vows',icon:'🟣',when:{after:'e2',st:{tier9:2}},nodes:{
start:{p:['The first Voidsteel blade comes out of the forge dark as a closed eye and light as a rumor. Hildy turns it over twice, goes very quiet, and then very loud.','>Hildy Stonehammer|That is the best thing I have ever <i>stood next to</i>.','>Dunstan|It\'s not just ore, Spark. It\'s a thing that remembers the day nobody finished it. Voidsteel wants to be <i>completed</i>. That\'s why it\'s heavy. That\'s why it hums.','>Fizzwick|The voidbloom extracts are also— I\'m just saying — remarkable, if one is careless with eyebrows.'],
 c:[{t:'"How do we get to the Hollow Throne?"',go:'throne'}]},
throne:{p:['>Dunstan|You\'ll want Tier X gear at least by then. The Throne\'s court is vicious: ethereal courtiers, armored champions, three-headed chimeras. Clear the <b>Gauntlet of the Ashen Gate</b> first — it\'s a good dress rehearsal — then take on the Throne\'s boss.','>Dunstan|Tip: the Hollow Regent is a caster and weak to Storm and Void. If you\'re still swinging a plain steel longsword at him, you\'re doing it wrong.'],c:[{t:'Gear up',end:true,fx:{xp:8000,sp:1,it:[['gold_ingot',8]]}}]}}},

{id:'e4',title:'The Hollow Regent',icon:'👑',when:{after:'e3',st:{boss_hollowthrone:1}},nodes:{
start:{p:['The Sovereign of Unfinished Things kneels. The gap in its crown shows, briefly, the sky beyond.','>The Regent|You can… see me. Nobody ever looked at the crown. I have worn it since the first thing was left undone. Do you know what the gap is?','>Dunstan|…Oh. Oh no. I\'m the gap.','>The Regent|You are the anvil that was never struck. Billie struck you once, thirty years ago, and you woke up. It was the first time anything had been <i>finished</i> in an age.','>Dunstan|Spark. I think the Last Anvil isn\'t me. I think… it\'s whatever <i>you</i> make with me.'],
 c:[{t:'"Then we make something."',go:'make'},{t:'"You\'re not the gap. You\'re the anvil."',go:'make'}]},
make:{p:['>The Regent|The Heart waits below. It does not want to hurt you. It wants to be finished. It will fight you with everything it never became. Please… be gentler than the world was.','>Dunstan|Tier XI. Primordial. And a Gauntlet at the Throne to prove the arm can hold it. Then — then we go.'],c:[{t:'Take the crown\'s Core',end:true,fx:{xp:12000,sp:2,g:60000,title:'Regent-Breaker'}}]}}},

{id:'e5',title:'The Last Preparation',icon:'🍽️',when:{after:'e4',st:{tier11:1,gaunt_hollowthrone:1}},nodes:{
start:{p:['Everyone has come to the Crooked Crucible. Pip with a bucket of embers. Hildy with a rivet in her teeth. Bartleby, polished. Elmira, with a sapling. Arachne with a thread that might be fate. Fennick with something he swears he found. Fizzwick, eyebrows gone again. Gran with a table.','>Gran Marrow|Sit. Eat. We are not fighting the end of the world on an empty stomach.','>Dunstan|One last bit of planning. Each of them can give you a gift. Pick the one you trust.'],
 c:[{t:'Gran\'s Last Supper (a hearty buff for the fight)',go:'gran'},{t:'Ottoline\'s Ward (a protective charm)',go:'ward'},{t:'Hildy\'s Edge (a sharper weapon)',go:'edge'},{t:'No gifts. Just me.',go:'solo'}]},
gran:{p:['You eat until you cannot see the end of the table. You feel unreasonably capable.'],c:[{t:'Into the Heart',go:'fight',fx:{fl:'gift_gran'}}]},
ward:{p:['Ottoline draws a rune in the air. It sits on your shoulder like a very small, very smug bird.'],c:[{t:'Into the Heart',go:'fight',fx:{fl:'gift_ward'}}]},
edge:{p:['Hildy hones your weapon until it hums. She will not tell you how many times she did it. It was a lot.'],c:[{t:'Into the Heart',go:'fight',fx:{fl:'gift_edge'}}]},
solo:{p:['You nod at your friends. They nod back. Gran slips a casserole in your pack anyway.'],c:[{t:'Into the Heart',go:'fight'}]},
fight:{p:['The Heart of the Unfinished is not a place. It is an argument with the idea of completion. The walls are sketches. The floor is a draft. In the middle, something looks up, enormous and sleepy and hurt.','>The Unfinished One|…Are you the one who finishes?','>Dunstan|It\'s in pain, Spark. Be firm. Be fair.'],
 c:[{t:'"I am."  (Fight)',fight:'unfinished_4',mods:{hp:1,atk:1,xp:3},win:'won',lose:'lost'}]},
won:{p:['The Unfinished One lowers itself, line by line, into the shape of something finished. It looks, for the first time, like a very large, very tired child falling asleep.','>The Unfinished One|…Oh. So that\'s what it feels like.','>Dunstan|It\'s done, Spark. It\'s finished.'],c:[{t:'Stay with it until it sleeps',end:true,fx:{xp:30000,sp:3,g:200000,fl:'endgame_done',title:'Finisher of the Unfinished'}}]},
lost:{p:['The Heart pushes you back, gently, the way a tide returns a piece of driftwood. You are exhausted, not broken. Dunstan has a lot to say about your stance.','>Dunstan|Check your gear score. Check the weaknesses. Check your <i>snacks</i>. The Unfinished One\'s a caster of Void; wards help. We\'ll go again.'],c:[{t:'Regroup at the table',go:'start'}]}}},

{id:'e6',title:'The Finished Thing',icon:'🔥',when:{after:'e5',flag:'endgame_done'},nodes:{
start:{p:['Tinderbury has a new tradition. At dusk each day the whole town stops, and somebody — anybody — finishes one small thing: a sentence, a chair, a scone. The goose is, inexplicably, in charge of the ceremony.','The Crooked Crucible is still crooked. The Crucible still swings. The anvil still talks too much.','>Dunstan|You know what the gap in the crown was, in the end?','>Dunstan|It was a place for something to go.','He pauses, which for Dunstan is a statement.','>Dunstan|Thank you, Spark. For finishing me.'],
 c:[{t:'"Thank you for starting me."',end:true,fx:{xp:20000,sp:3,g:100000,ren:300}}]}}}
];
S3.forEach(function(s){STORY.push(s);STORY_BY[s.id]=s;});
