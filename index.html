<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14100d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Crooked Crucible">
<meta name="description" content="The Crooked Crucible — a crafting LitRPG">
<title>The Crooked Crucible</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>:root{--bg:#14100d;--bg2:#1d1712;--panel:#251d16;--panel2:#2e251c;--line:#4a3a2a;--ink:#f1e6d3;--dim:#b3a28a;--ember:#ff8a2b;--ember2:#ffb347;--gold:#ffd166;--good:#7fd17f;--bad:#ff6b5e;--blue:#6fb3ff;--purple:#c58bff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;overscroll-behavior:none}
h1,h2,h3,.ttl,.bigmsg .bt{font-family:'Cinzel',Georgia,serif;letter-spacing:.02em}
h3{margin:18px 4px 8px;font-size:15px;color:var(--ember2);text-transform:uppercase}h3 small{color:var(--dim);text-transform:none;font-family:inherit;margin-left:6px}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:linear-gradient(180deg,rgba(29,23,18,.92),rgba(20,16,13,.96))}
#hud{padding:calc(env(safe-area-inset-top) + 8px) 12px 6px;background:var(--bg2);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}.hrow+.hrow{margin-top:6px}
.hero{display:flex;flex-direction:column;flex:1;cursor:pointer}.hero b{font-family:'Cinzel',serif;font-size:15px}.hero small{color:var(--dim);font-size:12px}
.gold{font-weight:700;color:var(--gold);font-size:17px}
.lv{font-weight:700;font-size:13px;color:var(--ember2);min-width:38px}.st{font-size:13px;min-width:70px;text-align:right;color:var(--blue)}
.bar{flex:1;height:10px;background:#0e0b09;border:1px solid var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--ember2));border-radius:99px;transition:width .15s}
.bar.xp i{background:linear-gradient(90deg,#b66a1c,var(--ember2))}.bar.thin{height:5px;margin-top:4px}
.bfs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.bf{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:12px}
#ticker{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#1a130e;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim);font-style:italic;min-height:36px}
#ticker .an{flex:none}
#main{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
#nav{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nt{flex:1;position:relative;background:none;border:0;color:var(--dim);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;cursor:pointer}
.nt span{font-size:21px}.nt small{font-size:11px}.nt.on{color:var(--ember2);background:linear-gradient(0deg,rgba(255,138,43,.14),transparent)}
.nb{position:absolute;top:3px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-style:normal;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.warn{border-color:var(--ember);background:#2f2014}.card.dimc{opacity:.6}.card.ready{border-color:var(--good)}
.card.story,.card .sh,.row,.jrow{display:flex;align-items:center;gap:10px}.card.story{border-color:var(--ember2)}
.jrow{justify-content:space-between}.grow{flex:1;min-width:0}
.por{flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:12px;border:1px solid var(--line)}
.lab{display:block;color:var(--ember);font-size:11px;letter-spacing:.1em;font-weight:700}
.dim{color:var(--dim)}.sm{font-size:13px}.c{text-align:center}.pad{padding:14px 6px}.hint{padding:2px 4px 8px;font-size:14px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.scard:active{transform:scale(.97)}.scard .si{font-size:30px}.scard small{color:var(--dim)}.scard .bar{width:80%;flex:none}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember)}
.btn{background:linear-gradient(180deg,var(--ember2),var(--ember));color:#2a1405;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}.btn.sm{padding:7px 12px;font-size:14px}.btn.big{width:100%;padding:16px;font-size:20px;margin:10px 0 6px;font-family:'Cinzel',serif}
.btn:disabled,.mini:disabled{opacity:.4;pointer-events:none}.btn:active{transform:scale(.97)}
.mini{background:var(--panel2);color:var(--ink);border:1px solid var(--ember);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.mini.danger{border-color:var(--bad);color:var(--bad)}
.back{background:none;border:0;color:var(--ember2);font:inherit;font-weight:700;padding:2px 0 8px;cursor:pointer}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.chips.sc{flex-wrap:nowrap;overflow-x:auto}
.chip{flex:none;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--ember);color:#2a1405;border-color:var(--ember);font-weight:700}
.big-i{font-size:34px}.big-i.sm{font-size:28px}.ttl small{color:var(--dim);font-size:13px;font-family:inherit}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}.rc.lv,.rc.st{opacity:.55}
.rt{display:flex;justify-content:space-between;gap:8px}.rl{color:var(--dim);font-size:13px;white-space:nowrap}.rinfo{color:var(--dim);font-size:13px;margin:2px 0}
.ings{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.ing{font-size:12.5px;background:#0e0b09;border:1px solid var(--line);border-radius:8px;padding:2px 7px}.ing.ok{color:var(--good);border-color:#3f6a3f}.ing.no{color:var(--bad);border-color:#6a3a35}
.own{font-size:12px;color:var(--dim)}.cb{display:flex;gap:6px;margin-top:6px}.lock{font-size:13px;color:var(--dim);margin-top:4px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}.card .row{background:none;border:0;border-bottom:1px solid #3a2d20;border-radius:0;margin:0}
.in{font-weight:600}.q{font-size:11px}
.perks{display:grid;gap:4px;margin-top:8px}.perk{font-size:13px;padding:4px 8px;border-radius:8px;background:#0e0b09;opacity:.6}.perk.on{opacity:1;border:1px solid #3f6a3f}.perk small{display:block;color:var(--dim)}
.zones{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}.zc{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:60px}.zc span{font-size:22px}.zc small{font-size:11px;color:var(--dim)}.zc.on{border-color:var(--ember);background:#33220f}.zc.lck{opacity:.45}
.gres{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:30px}.gc{font-size:13px;background:#0e0b09;border:1px solid var(--line);border-radius:99px;padding:3px 10px;animation:pop .25s}.gc.rare{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(255,209,102,.4)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
details summary{cursor:pointer;color:var(--ember2);font-size:14px;padding:4px 0}.loot{display:flex;flex-wrap:wrap;gap:5px;padding-top:6px}
select{width:100%;background:#0e0b09;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;margin-top:6px}
.req{margin:6px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.stat{background:#0e0b09;border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;display:flex;flex-direction:column}.stat b{font-size:18px}.stat small{color:var(--dim);font-size:11px}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mk{font-size:22px;opacity:.25;filter:grayscale(1)}.mk.on{opacity:1;filter:none}
textarea,input{width:100%;background:#0e0b09;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(5,3,2,.78);align-items:flex-end;justify-content:center}#modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--ember);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:19px}
.mbody{padding:14px 16px;overflow-y:auto;font-size:17px;line-height:1.5}.mbody p{margin:0 0 12px}
.say{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--ember);background:var(--panel2);border-radius:0 10px 10px 0}.say b{color:var(--ember2)}
.chk{margin-bottom:10px;padding:6px 10px;border-radius:8px;background:#0e0b09;color:var(--ember2);font-size:14px}
.mc{display:flex;flex-direction:column;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.title{text-align:center}.title .tl{padding:20px 10px 6px}.title h1{margin:6px 0 2px;color:var(--ember2)}
.track{position:relative;height:30px;background:#0e0b09;border:1px solid var(--line);border-radius:99px;margin:14px 0}.track .zone{position:absolute;left:35%;width:30%;top:0;bottom:0;background:rgba(255,138,43,.3);border-left:2px solid var(--ember);border-right:2px solid var(--ember)}.track .mark{position:absolute;top:-4px;width:8px;height:38px;background:#fff;border-radius:4px;transform:translateX(-50%);box-shadow:0 0 10px #fff}
.logl{padding:6px 0;border-bottom:1px solid #3a2d20;font-size:15px}
#toasts{position:fixed;left:0;right:0;bottom:82px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(37,29,22,.96);border:1px solid var(--ember);border-radius:99px;padding:8px 16px;font-size:14px;max-width:92%;animation:pop .2s;transition:opacity .4s,transform .4s}.toast.out{opacity:0;transform:translateY(-10px)}
.bigmsg{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(255,138,43,.25),transparent 60%);animation:pop .3s;transition:opacity .5s}.bigmsg.out{opacity:0}
.bigmsg .bt{font-size:44px;font-weight:800;color:var(--gold);text-shadow:0 0 20px var(--ember)}.bigmsg .bs{color:var(--ink);font-size:18px}

/* ===== AAA POLISH LAYER ===== */
:root{--glow:0 0 18px rgba(255,138,43,.35);--bevel:inset 0 1px 0 rgba(255,235,200,.08),inset 0 -1px 0 rgba(0,0,0,.4);--shadow:0 6px 18px rgba(0,0,0,.45)}
body{background:radial-gradient(1200px 700px at 50% -10%,#2a1a0f 0%,#14100d 55%,#0b0806 100%) fixed}
#app{box-shadow:0 0 60px rgba(0,0,0,.7);border-left:1px solid #2a1f15;border-right:1px solid #2a1f15;background:linear-gradient(180deg,rgba(33,25,18,.9),rgba(16,12,9,.97))}
#hud{background:linear-gradient(180deg,#2b2017,#1b140e);border-bottom:1px solid #6a4a2a;box-shadow:0 4px 14px rgba(0,0,0,.5);position:relative;z-index:3}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ember),transparent);opacity:.7}
.hero b{text-shadow:0 1px 0 #000,0 0 10px rgba(255,138,43,.25)}
.gold{background:linear-gradient(180deg,#fff0b8,#ffc94d 55%,#d98a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #000);font-family:'Cinzel',serif}
.lv{background:radial-gradient(circle at 30% 25%,#ffd58a,#c9741c 70%);color:#2a1405;border-radius:99px;padding:3px 8px;min-width:auto;text-align:center;box-shadow:var(--bevel),0 2px 6px rgba(0,0,0,.5);font-family:'Cinzel',serif}
.bar{height:12px;background:linear-gradient(180deg,#050302,#120c08);box-shadow:inset 0 2px 4px rgba(0,0,0,.8);border-color:#5a4028;position:relative}
.bar i{background:linear-gradient(180deg,#ffd08a 0%,var(--ember) 45%,#b4510c 100%);box-shadow:0 0 10px rgba(255,138,43,.5);transition:width .35s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.8s infinite}
@keyframes shine{0%{left:-50%}60%,100%{left:130%}}
#ticker{background:linear-gradient(180deg,#160f0a,#1d140d);border-bottom:1px solid #3d2c1c}
#ticker span:last-child{animation:tick .5s ease}@keyframes tick{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#main{scroll-behavior:smooth;animation:viewIn .28s ease}@keyframes viewIn{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
#nav{background:linear-gradient(0deg,#120c08,#251a11);border-top:1px solid #6a4a2a;box-shadow:0 -6px 18px rgba(0,0,0,.5)}
.nt{transition:transform .15s,color .2s}.nt:active{transform:scale(.9)}
.nt span{filter:grayscale(.6) brightness(.85);transition:filter .2s,transform .2s}
.nt.on span{filter:drop-shadow(0 0 8px rgba(255,138,43,.8));transform:translateY(-2px) scale(1.12)}
.nt.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--ember2);box-shadow:0 0 10px var(--ember)}
.card{background:linear-gradient(180deg,#2d231a,#231a12);box-shadow:var(--bevel),var(--shadow);border-color:#54402b;transition:transform .15s,border-color .2s}
.card.warn{background:linear-gradient(180deg,#3a2615,#2a1a0e);box-shadow:var(--bevel),var(--glow);animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:var(--bevel),0 0 26px rgba(255,138,43,.5)}}
h3{display:flex;align-items:center;gap:10px}h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.por{background:radial-gradient(circle at 30% 20%,#4a3826,#1c140d);box-shadow:var(--bevel),inset 0 0 14px rgba(0,0,0,.6);border-color:#6a4a2a}
.scard{background:linear-gradient(180deg,#32261b,#221810);box-shadow:var(--bevel),var(--shadow);transition:transform .15s,box-shadow .2s,border-color .2s}
.scard:hover{border-color:var(--ember);box-shadow:var(--bevel),var(--glow)}
.scard .si{filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.btn{background:linear-gradient(180deg,#ffd38a 0%,#ff9a3c 45%,#d4640f 100%);box-shadow:var(--bevel),0 3px 0 #7a3a0a,0 6px 14px rgba(0,0,0,.5);text-shadow:0 1px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(3px);box-shadow:var(--bevel),0 0 0 #7a3a0a,0 2px 6px rgba(0,0,0,.5)}
.btn.alt{background:linear-gradient(180deg,#3a2d20,#281d14);box-shadow:var(--bevel),0 3px 0 #120c08;text-shadow:none}
.mini{background:linear-gradient(180deg,#3a2d20,#281d14);box-shadow:var(--bevel);transition:transform .08s,border-color .2s}.mini:active{transform:scale(.93)}
.chip{background:linear-gradient(180deg,#2e231a,#21180f);box-shadow:var(--bevel);transition:all .15s}
.chip.on{background:linear-gradient(180deg,#ffb35c,#e06f14);box-shadow:var(--bevel),0 0 12px rgba(255,138,43,.5);color:#2a1405}
.rc{background:linear-gradient(180deg,#2c2218,#221910);box-shadow:var(--bevel);transition:transform .15s,border-color .2s;position:relative;overflow:hidden}
.rc:not(.lv):not(.st):hover{border-color:#8a6238}
.rc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--line))}
.ing{background:linear-gradient(180deg,#0b0705,#150e09);box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.row{background:linear-gradient(180deg,#2a2017,#211910);box-shadow:var(--bevel);transition:transform .12s}
.row:active{transform:scale(.99)}
.in{text-shadow:0 1px 0 rgba(0,0,0,.6)}
.q{padding:1px 6px;border-radius:99px;border:1px solid currentColor;background:rgba(0,0,0,.35);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.stat{background:linear-gradient(180deg,#120c08,#1c130c);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.stat b{font-family:'Cinzel',serif;color:var(--ember2);text-shadow:0 0 10px rgba(255,138,43,.35)}
.gc{background:linear-gradient(180deg,#1a120c,#0e0a07);box-shadow:var(--bevel)}
.gc.rare{animation:rareGlow 1.4s infinite alternate}@keyframes rareGlow{from{box-shadow:0 0 6px rgba(255,209,102,.4)}to{box-shadow:0 0 18px rgba(255,209,102,.9)}}
.mk.on{filter:drop-shadow(0 0 8px rgba(255,209,102,.8));animation:float 3s infinite ease-in-out}@keyframes float{50%{transform:translateY(-3px)}}
.perk.on{background:linear-gradient(90deg,#17301a,#0e0b09);box-shadow:inset 3px 0 0 var(--good)}
#modal{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(5,3,2,.72)}
.sheet{background:linear-gradient(180deg,#2e2319,#1d150e);box-shadow:0 -10px 40px rgba(0,0,0,.7),0 0 0 1px #6a4a2a,var(--glow);border-color:#8a6238;animation:sheetUp .32s cubic-bezier(.2,.9,.25,1.05)}
@keyframes sheetUp{from{transform:translateY(60px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.mh{background:linear-gradient(180deg,#3a2b1d,#2b2017);border-radius:20px 20px 0 0}
.mh h2{text-shadow:0 0 12px rgba(255,138,43,.3)}
.mbody p{opacity:0;animation:para .55s ease forwards}
.mbody p:nth-child(1){animation-delay:.05s}.mbody p:nth-child(2){animation-delay:.3s}.mbody p:nth-child(3){animation-delay:.6s}.mbody p:nth-child(4){animation-delay:.95s}.mbody p:nth-child(5){animation-delay:1.3s}.mbody p:nth-child(n+6){animation-delay:1.6s}
@keyframes para{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.say{background:linear-gradient(90deg,#3a2a1b,#2a2017);box-shadow:var(--bevel)}
.mc .btn{text-align:left;font-family:'Alegreya Sans',sans-serif}
.chk{border:1px solid #6a4a2a;box-shadow:inset 0 0 10px rgba(255,138,43,.12)}
.toast{background:linear-gradient(180deg,#352719,#241a11);box-shadow:var(--shadow),var(--glow);border-color:var(--ember2)}
.bigmsg .bt{font-size:clamp(34px,10vw,56px);animation:bigIn .7s cubic-bezier(.2,1.4,.3,1);background:linear-gradient(180deg,#fff6c9,#ffc94d 55%,#ff8a2b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,138,43,.8))}
@keyframes bigIn{from{transform:scale(.3) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.burst{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity .6s;--bc:#c58bff}
.burst.q5{--bc:#ffb43c}.burst.out{opacity:0}

 mons:[['Star Beetle','🪲','armored','storm','','Shell: meteoric. Attitude: also.','o'],['Void Moth','🦋','ethereal','ember','void','Drawn to your lamp. And your soul.','f'],['Cosmic Jelly','🪼','caster','storm','void','Translucent and smug.','s'],['Meteor Golem','☄️','brute','frost','ember','Fell from the sky. Landed angry.','g'],['The Starfallen Knight','🛡️','armored','void','void','Fell from grace. And a lot higher.','o']]},
{id:'caldera',name:'Emberwake Caldera',icon:'🌋',tier:6,lv:34,decor:'🌋',sky:['#7a2a10','#33100a','#190804'],blurb:'Vesperax\'s extended family lives here. They are not as chill.',
 mons:[['Magma Drake','🐉','caster','frost','ember','Hot. Hungry. Entitled.','h'],['Cinder Cultist','🧎','caster','frost','ember','Worships a very small fire.','s'],['Phoenix Fledgling','🐦‍🔥','swift','frost','ember','Dies often. Takes it personally.','f'],['Obsidian Knight','⚔️','armored','frost','','Edgy in every sense.','o'],['Ignatia the Overcooked','🐲','caster','frost','ember','Vesperax\'s cousin. Burnt her last three apprentices. And the toast.','g']]},
{id:'tidewrack',name:'Tidewrack Depths',icon:'🌊',tier:6,lv:38,decor:'🌊',sky:['#0e4a6a','#062033','#030d16'],blurb:'The sea is full of things the sea would like back.',
 mons:[['Crab Knight','🦀','armored','storm','','Claws like shields. Shields like claws.','o'],['Kraken Spawn','🦑','brute','storm','','Only 40 feet. It\'s still growing.','h'],['Drowned Pirate','🏴‍☠️','swift','ember','','Owes you no booty. Takes yours.','g'],['Siren of the Shoal','🧜','caster','storm','void','Sings off-key. Fatally.','b'],['The Leviathan of Lost Things','🐋','brute','storm','','Swallowed your umbrella in 1992.','m']]},
{id:'ruins',name:'Clockwork Ruins',icon:'⚙️',tier:7,lv:44,decor:'⚙️',sky:['#4a4a3a','#201f16','#0f0e08'],blurb:'The gears still turn. Nothing here remembers why.',
 mons:[['Clockwork Soldier','🤖','armored','storm','','Ticks. Tocks. Stabs.','o'],['Gear Wraith','👻','ethereal','storm','','Haunts the broken clocks.','s'],['Rust Drake','🦖','brute','frost','','Rusted open. Mean, rusted.','h'],['Sentinel Prime','🛡️','armored','void','','Guards nothing. Passionately.','g'],['The Unwound Colossus','🗼','brute','storm','','Has been winding down for 900 years.','o']]},
{id:'canopy',name:'Skyroot Canopy',icon:'☁️',tier:7,lv:50,decor:'☁️',sky:['#4a7a9a','#1d3550','#0b1624'],blurb:'The trees are so tall the birds file complaints. The birds are armed.',
 mons:[['Skyroot Harpy','🦅','swift','frost','','Screeches in a minor key.','f'],['Cloud Serpent','🐍','swift','ember','storm','Coils around thunder.','h'],['Thunder Roc Chick','🐦','caster','frost','storm','Still big. Still electric.','m'],['Rootspire Guardian','🌲','armored','ember','','Four hundred rings. Zero patience.','w'],['Stormcaller Roc','🦅','caster','frost','storm','Wings like two thunderclouds.','b']]},
{id:'depths',name:'Aetherium Depths',icon:'🕳️',tier:8,lv:56,decor:'💠',sky:['#1a3a5a','#0a1428','#04070f'],blurb:'The deeper you go, the more the walls hum. At the bottom, they sing.',
 mons:[['Aether Wraith','👻','ethereal','storm','void','Made of echoes.','s'],['Crystal Horror','💎','armored','storm','','Faceted. Furious.','g'],['Void Stalker','🌀','swift','ember','void','Appears behind you. Always.','h'],['Deep Mimic','📦','armored','void','','It was a treasure chest. Now it\'s hungry.','o'],['The Anvilbeast Primeval','🦏','brute','void','','Metal hide. Hammer horn. Mood: bad.','o']]},
{id:'heap',name:'The Heap Citadel',icon:'🗑️',tier:8,lv:62,decor:'🗑️',sky:['#4a4540','#1f1c18','#0e0c0a'],blurb:'Thirty years of Guaranteed™ goods, now with opinions.',
 mons:[['Warranty Phantom','👻','ethereal','void','','Voids all warranties. Including yours.','s'],['Heap Golem','🤖','armored','ember','','Out of warranty, in a mood.','o'],['Shard Scorpion','🦂','swift','frost','','Made of every broken mirror.','g'],['Mirage Djinn','🧞','caster','storm','void','Grants three wishes. Delivers none.','b'],['Gildenhoard the Reclaimed','🤑','caster','void','void','Returned as a spreadsheet. Furious.','s']]},
/* ENDGAME */
{id:'ashengate',name:'The Ashen Gate',icon:'🚪',tier:9,lv:70,end:1,decor:'🔥',sky:['#5a2a40','#240e1c','#0c050a'],blurb:'The door at the edge of the Unfinished. Nothing has ever come back through it with its dignity intact.',
 mons:[['Ashen Revenant','💀','armored','frost','ember','Burned once. Resents it.','o'],['Voidsteel Sentinel','🗿','armored','storm','','Guard of a gate that no longer exists.','o'],['Ash Hound','🐕‍🦺','swift','frost','ember','Sniffs out failures. Eats them.','m'],['Gatekeeper Ember','⚔️','caster','frost','ember','Checks credentials. Then ruins them.','s'],['The Warden of Ash','👹','brute','frost','ember','Opens the gate. Only outward.','g']]},
{id:'hollowthrone',name:'The Hollow Throne',icon:'👑',tier:10,lv:75,end:1,decor:'👑',sky:['#4a3a10','#241a06','#0c0803'],blurb:'The throne of the thing that never finished anything. The room is large. The echo is larger.',
 mons:[['Court of Echoes','👥','ethereal','storm','void','Applauds itself. Politely.','s'],['Starforged Champion','🤺','armored','void','','Made to fight. Never knew why.','o'],['Throne-Court Chimera','🦁','swift','frost','','Three heads. One opinion.','m'],['The Hollow Regent','🫅','caster','storm','void','Rules over nothing. Elegantly.','g'],['The Sovereign of Unfinished Things','👑','caster','storm','void','Wears a crown with a gap. The gap is you.','b']]},
{id:'unfinished',name:'Heart of the Unfinished',icon:'🌌',tier:11,lv:80,end:1,decor:'🌌',sky:['#3a0a2a','#16040f','#070208'],blurb:'The beating, spilling, half-sketched heart of everything that was never made right. It would like to be finished now.',
 mons:[['Sketch of a Dragon','🐉','ethereal','void','void','Outline only. Bites in full color.','s'],['Half-Forged Colossus','🗿','brute','void','','Missing an arm. Unbothered.','o'],['Placeholder Horror','👾','swift','storm','void','LOREM IPSUM. LOREM. IPSUM.','h'],['The Draft That Would Not Die','📜','caster','ember','void','Revised eleven times. Worse each time.','s'],['The Unfinished One','🌌','caster','void','void','It is everything that was ever left half-done. It is tired. It is furious.','b']]}
];

{id:'ch1',title:'Hot Metal and Cold Feet',icon:'🔥',when:{after:'tut_apprentice',st:{crafted:3}},nodes:{
start:{p:['The forge hums. Your first few creations sit on the bench like nervous guests at a dinner party.','>Dunstan|Not bad for someone who had to be told which end of the tongs to hold. A customer is coming. Be natural. Do not say "behold."','The door bangs open. Wendel the Bard strides in, plucks a lute string, and winces.','>Wendel|I seek a weapon of legend! Or something sharp. I have eleven gold and a dream.'],
 c:[{t:'Haggle with a charming smile',chk:{s:'charm',dc:6,ok:'win',fail:'lose'}},{t:'Give him a friendly discount',go:'kind'},{t:'Show him the price board silently',go:'cold'}]},
win:{p:['You turn on the charm. Wendel blushes, drops his lute, and pays twice what he intended.','>Dunstan|I take it back. You might survive this.'],c:[{t:'Take the coin',end:true,fx:{g:60,xp:30,rep:{town:1}}}]},
lose:{p:['You attempt charm. It comes out as a series of eyebrow movements.','>Wendel|Are you having a stroke?','>Dunstan|No. That is just how they do it. Sell him the thing, Spark.'],c:[{t:'Quietly sell',end:true,fx:{g:25,xp:20}}]},
kind:{p:['Wendel pays what he can and writes a ballad about you on the spot. It rhymes "Quench" with "wrench." It is awful. The whole street hums it by evening.','>Dunstan|Great. Now I can\'t un-hear it.'],c:[{t:'Take a bow',end:true,fx:{g:35,xp:35,rep:{town:2}}}]},
cold:{p:['You point at the price board. Wendel pays without a word and leaves with the air of a man being robbed by a shrub.','>Dunstan|Efficient. A little cold. I\'ll allow it.'],c:[{t:'Pocket the gold',end:true,fx:{g:45,xp:25,rep:{guild:1}}}]}}},

{id:'ch2',title:'The Concord Comes to Tea',icon:'🎩',when:{after:'ch1',lv:4},nodes:{
start:{p:['A very clean man in a very gold waistcoat sits in your only chair. The chair seems to resent him.','>Mr. Smarm|Pleasure! I represent the Gilded Concord. We make quality goods. Guaranteed™! Guaranteed for exactly thirty days, thereafter customers love buying them again!','>Dunstan|He just said the quiet part loud.','>Mr. Smarm|We would like to buy your shop. Generously. For you. Sign here, here, and here, and also initial the part where you forget this conversation.'],
 c:[{t:'Throw the contract in the forge',go:'burn'},{t:'Counter-offer with ridiculous terms (Wits)',chk:{s:'wits',dc:8,ok:'counter',fail:'flop'}},{t:'Politely decline and offer tea',go:'tea'}]},
burn:{p:['The contract catches fire with a cheerful whump. Mr. Smarm jumps back, adjusting his waistcoat.','>Mr. Smarm|The Concord will remember this.','>Dunstan|The Concord can remember it from outside.'],c:[{t:'Show him the door',end:true,fx:{xp:60,rep:{town:2,concord:2},g:20}}]},
counter:{p:['You demand ownership of his waistcoat, free lifetime tea, and the right to rename the Concord "The Gilded Concern." He lawyers himself into a corner and flees.','>Dunstan|Spark, that was magnificent. I don\'t know whether to cry or invoice him.'],c:[{t:'Collect your winnings',end:true,fx:{xp:90,g:120,rep:{guild:2,concord:1}}}]},
flop:{p:['You try to counter and accidentally agree to a "discretionary snack fee." Mr. Smarm beams and leaves a pamphlet.','>Dunstan|You owe the Concord a snack. We\'ll pretend this never happened.'],c:[{t:'Accept the pamphlet shame',end:true,fx:{xp:40,g:-10}}]},
tea:{p:['You pour tea. Mr. Smarm drinks it and is delighted, right up until he realizes it was your quench water.','>Mr. Smarm|This is... earthy.','>Dunstan|It\'s lead.'],c:[{t:'Smile sweetly',end:true,fx:{xp:60,rep:{town:1,guild:1}}}]}}},

{id:'ch3',title:'The Seven Marks',icon:'✨',when:{after:'ch2',lv:7},nodes:{
start:{p:['The forge is warmer. The workshop has stopped leaking, mostly.','>Dunstan|Time you knew the truth. The Hallowed Guild once ran the Seven Marks, trials of true mastery. Each craft has a station, each station has a mentor, and each mentor is mildly deranged.','>Dunstan|Reach level 15 in a craft and you earn its Mark. Collect seven Marks and the Hallowed Vault opens. Your aunt designed it. Do not ask me how she made it work.','You glance at the other benches. Each one seems to look back.'],
 c:[{t:'Tell Dunstan about your plan to master everything',go:'plan'},{t:'Ask why it has to be seven',go:'seven'}]},
plan:{p:['>Dunstan|Everything? Ambitious. Foolish. Billie would have loved you.'],c:[{t:'Get to work',end:true,fx:{xp:100,sp:1,fl:'marks_known',title:'Mark-Seeker'}}]},
seven:{p:['>Dunstan|Because ten would have been unreasonable and six felt cheap. Billie thought seven sounded like a good number. We do not question Billie.'],c:[{t:'Fair enough',end:true,fx:{xp:100,sp:1,fl:'marks_known',title:'Mark-Seeker'}}]}}},

{id:'ch4',title:'Dear Tinderbury, Love, A Dragon',icon:'🐉',when:{after:'ch3',lv:10},nodes:{
start:{p:['A scroll arrives by a very bored vulture. The seal is a claw print the size of a plate.','>Letter|To the mortals of Tinderbury. I am Vesperax the Unimpressed. I shall attend your Festival of Embers to assess the quality of your craft. Do not disappoint me. The last town that did is now a pleasant lake. Warmly, V.','Within the hour the town square is a riot of fear, bunting and one man selling "dragon insurance."','>Dunstan|This is a problem. And a business opportunity. Mostly a problem.'],
 c:[{t:'Rally the town to prepare',chk:{s:'charm',dc:9,ok:'rally',fail:'panic'}},{t:'Sell "dragon-proof" gear to the frightened',go:'sell'},{t:'Write back with questions',go:'write'}]},
rally:{p:['You climb a barrel and give a speech that includes the phrases "quality," "community," and "please don\'t be a lake." People cheer. A goose cheers louder.','>Dunstan|You had me at "lake."'],c:[{t:'Take the applause',end:true,fx:{xp:140,rep:{town:3},g:40,fl:'dragon_known'}}]},
panic:{p:['Your speech starts strong and then you say "dragon" three times too many. The crowd stampedes. Someone sells a dragon-shaped hat.','>Dunstan|It\'s a hat, Spark. At least it\'s a hat.'],c:[{t:'Cough politely',end:true,fx:{xp:80,fl:'dragon_known'}}]},
sell:{p:['"Dragon-Proof" gear is, strictly speaking, just gear. You charge triple. Nobody asks. Nobody <i>can</i> ask.','>Dunstan|I disapprove. I\'m also impressed.'],c:[{t:'Count the coins',end:true,fx:{g:200,xp:70,rep:{town:-1,concord:1},fl:'dragon_known'}}]},
write:{p:['You send a reply asking about timing, preferences, and whether she accepts tea. The vulture returns with a single word on the back: <i>"Polite."</i>','>Dunstan|It\'s a start. She likes polite.'],c:[{t:'Preen',end:true,fx:{xp:120,rep:{guild:2,town:1},fl:'dragon_known',it:[['glass_vial',3]]}}]}}},

{id:'ch5',title:'The Rival Arrives',icon:'⚔️',when:{after:'ch4',lv:14},nodes:{
start:{p:['The door opens. Sunlight pours in. A woman in impossibly clean armor walks across your sawdust and does not leave footprints.','>Calla Brightforge|I am Calla Brightforge, Champion of the Gilded Concord. I make flawless gear. Flawless means "indistinguishable from each other." I\'ve come to challenge you to a Craft-Off.','>Dunstan|Spark. She\'s very good. She\'s also in a show. Don\'t panic.','>Calla|Bring me your best weapon, Fine quality or better. I shall judge. And win.'],
 c:[{t:'Accept (the Craft-Off begins)',end:true,fx:{trial:'craftoff',xp:100}}]}}},
{id:'ch5b',title:'Calla\'s Verdict',icon:'⚔️',when:{trial:'craftoff'},nodes:{
start:{p:['Calla turns your weapon over twice. Her eyebrow performs a small, involuntary dance.','>Calla|It\'s... asymmetrical. The grip is uneven. There\'s a mark here that looks like a thumb.','>Dunstan|That\'s a <i>maker\'s mark</i>, you philistine.','>Calla|It\'s better than mine.','She says it as though it hurts.'],
 c:[{t:'Be gracious',go:'grace'},{t:'Gloat quietly',go:'gloat'}]},
grace:{p:['You thank her. She glares, then takes a card from her pocket.','>Calla|If you ever want a real job... no. Forget it. Goodbye.'],c:[{t:'Wave her off',end:true,fx:{xp:200,rep:{guild:3,town:2},g:150}}]},
gloat:{p:['You smile like a cat holding a very small bird. Calla leaves without a word, but slams the door a little harder than needed.','>Dunstan|Petty. Satisfying. Petty.'],c:[{t:'Enjoy it',end:true,fx:{xp:180,rep:{concord:2},g:220}}]}}},

{id:'ch6',title:'Guaranteed™ Failure',icon:'🌉',when:{after:'ch5b',lv:18},nodes:{
start:{p:['The Concord\'s new Guaranteed™ bridge collapses on its thirtieth day, to the minute. The cheering crowd is not cheering anymore.','>Dunstan|Planned obsolescence. They timed it. They put a <i>sticker on it</i> that said "Expires".','The town square fills with shouting, and then, increasingly, with people looking at you.','>Mayor Hobbs|Spark! We need a bridge! A <i>good</i> one!'],
 c:[{t:'Lead the repair with muscle (Might)',chk:{s:'might',dc:14,ok:'strong',fail:'oops'}},{t:'Design a clever fix (Wits)',chk:{s:'wits',dc:14,ok:'smart',fail:'oops'}},{t:'Ask the town to pitch in (Charm)',chk:{s:'charm',dc:14,ok:'crowd',fail:'oops'}}]},
strong:{p:['You haul the first beam into place yourself. The town cheers, a toddler claps, and a goose watches with grudging respect.'],c:[{t:'Take a bow',end:true,fx:{xp:240,rep:{town:4},g:200,fl:'bridge_fixed'}}]},
smart:{p:['You sketch a truss design on a napkin. It holds. Dunstan claims credit for the napkin.'],c:[{t:'Accept admiration',end:true,fx:{xp:260,rep:{town:3,guild:2},g:180,fl:'bridge_fixed'}}]},
crowd:{p:['You get twelve people to carry beams, three to cook, and one to sing. The bridge is built by dusk. The goose is not invited.'],c:[{t:'Throw a party',end:true,fx:{xp:250,rep:{town:5},g:120,fl:'bridge_fixed'}}]},
oops:{p:['The attempt goes sideways. A beam falls into the river. The river takes it personally. Eventually the bridge is built, but it\'s a bit crooked.','>Dunstan|Crooked bridge. Crooked Crucible. We\'re on brand.'],c:[{t:'Smile weakly',end:true,fx:{xp:120,rep:{town:1},g:60,fl:'bridge_fixed'}}]}}},

{id:'ch7',title:'Under the Forge',icon:'🗝️',when:{after:'ch6',lv:22,marks:3},nodes:{
start:{p:['You trip over a loose flagstone beside the anvil. Underneath: a spiral staircase and a smell of old magic and older cheese.','>Dunstan|Oh no.','>Dunstan|Oh, <i>no.</i>','>Dunstan|It\'s the Vault of the Hallowed Guild. I\'ve been sitting on this for thirty-one years and I really, really hoped nobody would trip over it.','The door at the bottom is sealed with three locks. Each lock hums with a different note.'],
 c:[{t:'Pick the locks (Finesse)',chk:{s:'finesse',dc:16,ok:'open',fail:'jam'}},{t:'Ask Dunstan for the code (Charm)',chk:{s:'charm',dc:15,ok:'open',fail:'jam'}},{t:'Smash it open (Might)',chk:{s:'might',dc:18,ok:'open',fail:'jam'}}]},
open:{p:['The locks click open one at a time. Inside, a hall full of tools, each labeled in a handwriting you recognize from the letter.','At the center: a hammer. It looks tired, like it has been waiting.','>Dunstan|That\'s the Guildmaster\'s hammer. It chooses its wielder. It… hmm. It chose you.'],c:[{t:'Pick it up',end:true,fx:{xp:400,it:[['guild_hammer',1]],rep:{guild:4},fl:'vault_open'}}]},
jam:{p:['The locks jam. Dunstan says something that is probably not in the Guild Handbook.','After an hour of increasingly desperate work, the third lock gives with an apologetic pop. Inside: the hammer, covered in dust and, somehow, glitter.'],c:[{t:'Take the hammer',end:true,fx:{xp:300,it:[['guild_hammer',1]],rep:{guild:3},fl:'vault_open'}}]}}},

{id:'ch8',title:'Dunstan\'s Confession',icon:'anvil',when:{after:'ch7',lv:27},nodes:{
start:{p:['The vault is quiet. The anvil is quieter than you\'ve ever heard him.','>Dunstan|I wasn\'t always an anvil.','>Dunstan|I was Dunstan Aldermoor, Guildmaster of the Hallowed Guild. Thirty-one years ago the Concord offered to buy the Guild name. I said no. Percival Gildenhoard said, "very well" and turned me into a piece of furniture.','>Dunstan|Billie, my apprentice, hid me here. She spent the rest of her life trying to find a way to undo it.','>Dunstan|I never told you because it\'s embarrassing. I\'m a retired Guildmaster. I am <i>currently</i> a block of iron with opinions.'],
 c:[{t:'"That sounds awful. I\'m so sorry."',go:'kind'},{t:'"Honestly? You\'re a great anvil."',go:'joke'},{t:'"We\'ll fix this. Together."',go:'vow'}]},
kind:{p:['>Dunstan|Thank you. Don\'t make it weird. Okay, a little weird.'],c:[{t:'Rest a hand on the anvil',end:true,fx:{xp:300,sp:1,rep:{guild:3},fl:'dunstan_known'}}]},
joke:{p:['>Dunstan|...I\'ll take it. I have been told I\'m very good at holding things still.'],c:[{t:'Grin',end:true,fx:{xp:300,sp:1,rep:{town:2},fl:'dunstan_known',it:[['dunstan_charm',1]]}}]},
vow:{p:['>Dunstan|You\'re your aunt\'s nephew. Or niece. Whichever. Alright. Let\'s fix it. And if we can\'t, I\'ll haunt the Concord from here. Efficiently.'],c:[{t:'Shake on it (anvils have no hands)',end:true,fx:{xp:340,sp:1,rep:{guild:4},fl:'dunstan_known'}}]}}},

{id:'ch9',title:'The Concord\'s Gambit',icon:'💼',when:{after:'ch8',lv:31},nodes:{
start:{p:['Percival Gildenhoard arrives in a carriage that is, somehow, all waistcoat. He tips a hat that is also a waistcoat.','>Gildenhoard|Spark Quench! A delight! I have an offer. Sell me the Crucible. I\'ll restore it, name it "Gildenhoard Premium Forge," and give you a yearly stipend of one (1) golden voucher.','>Dunstan|(whisper) Don\'t.','>Gildenhoard|Or I flood the market with Guaranteed™ goods. Your prices will crater by Thursday.','The town watches. Somewhere, a goose honks ominously.'],
 c:[{t:'Refuse. Politely.',go:'refuse'},{t:'Outwit him (Wits)',chk:{s:'wits',dc:20,ok:'wit',fail:'refuse'}},{t:'Expose his scheme to the town (Charm)',chk:{s:'charm',dc:20,ok:'expose',fail:'refuse'}}]},
refuse:{p:['"The Crucible is not for sale." Gildenhoard sighs. "Then your market suffers." The market does suffer, briefly.','>Dunstan|It\'ll bounce back. Hold your head high.'],c:[{t:'Hold your head high',end:true,fx:{xp:400,rep:{town:2,concord:3},fl:'gambit_done'}}]},
wit:{p:['You ask him to read the contract aloud. He does. It includes a clause that says the Concord must <i>refund every customer whose goods fail</i>. He\'d never read it.','>Gildenhoard|That\'s... not what it said in the draft.','>Dunstan|It was in <i>size eight font</i>, Percival.'],c:[{t:'Enjoy his panic',end:true,fx:{xp:550,rep:{town:3,guild:3,concord:2},g:500,fl:'gambit_done'}}]},
expose:{p:['You climb onto the carriage and read the failure dates aloud. The crowd gasps in unison. Somebody boos. Somebody boos <i>politely</i>.','>Gildenhoard|You\'ve made an enemy.','>Dunstan|You were already one. This is just more paperwork.'],c:[{t:'Bow',end:true,fx:{xp:550,rep:{town:5,concord:3},g:300,fl:'gambit_done'}}]}}},

{id:'ch10',title:'Up the Mountain',icon:'🌋',when:{after:'ch9',lv:36},nodes:{
start:{p:['The Festival of Embers is a month away. Emberwake Caldera glowers on the horizon like it has been waiting for an invitation.','>Dunstan|We need materials from the Caldera. We need a plan. We need, frankly, some sort of supplies.','Your mentors turn up at the door one by one, because they\'ve been talking, and none of them can keep a secret.','>Gran Marrow|I\'m coming. I\'ve fed worse.','>Nib Cogsworth|I brought a thing! It might help!'],
 c:[{t:'Bring Gran and Nib',go:'both'},{t:'Bring Ottoline for magic cover',go:'ott'},{t:'Go light and fast',go:'solo'}]},
both:{p:['Gran Marrow packs a cauldron. Nib packs a "retractable" something. You trek up with a surprising amount of snacks and one confirmed explosion.'],c:[{t:'Reach the rim',end:true,fx:{xp:500,rep:{guild:2},fl:'mountain_ready',bless:['xp',20,30]}}]},
ott:{p:['Ottoline Vex insists on teleporting the whole party, which works for most of the party. The remaining parts arrive eventually.','>Ottoline|Did I forget someone? I\'m sure it\'s fine.'],c:[{t:'Count the party',end:true,fx:{xp:500,rep:{guild:2},fl:'mountain_ready',bless:['luck',12,30]}}]},
solo:{p:['You go alone. It is quiet. It is lonely. You eat three sandwiches in one sitting. It is worth it.'],c:[{t:'Reach the rim',end:true,fx:{xp:500,rep:{town:1},fl:'mountain_ready',bless:['speed',20,30]}}]}}},

{id:'ch11',title:'Vesperax the Unimpressed',icon:'🐲',when:{after:'ch10',lv:40},nodes:{
start:{p:['The dragon is enormous, ancient, and bored in the specific way of someone who has seen every mediocre sword ever made.','>Vesperax|So you\'re the mortal. The one with the... crooked... forge.','>Dunstan|I\'m an anvil. Hello.','>Vesperax|Of course you are.','She scrutinizes your gear with a single eyelid. It is the most terrifying eyelid you have ever seen.'],
 c:[{t:'Offer tea',go:'tea'},{t:'Present your best work',go:'work'},{t:'Say something clever (Charm)',chk:{s:'charm',dc:22,ok:'clever',fail:'tea'}}]},
tea:{p:['"Tea," says Vesperax, trying the word out. She takes a sip. It disappears in a puff of embers.','>Vesperax|...Acceptable. That was the first acceptable thing in nine hundred years.','>Dunstan|(whisper) We might survive this.'],c:[{t:'Hear the test',go:'test'}]},
work:{p:['She picks up your best piece with a talon the size of a sword. She inspects it for a very long time.','>Vesperax|Competent. Not inspired. But honest.'],c:[{t:'Hear the test',go:'test'}]},
clever:{p:['You quip something about wanting "craft with soul." Vesperax\'s eyelid twitches, which is, for her, a laugh.','>Vesperax|Hm. There is hope.'],c:[{t:'Hear the test',go:'test'}]},
test:{p:['>Vesperax|Bring me a Heartfire Set. A weapon fit for a king. Armor fit for a queen. A ring. A feast. An enchantment. A potion. A cloak. A gadget. All of Superior quality. If they\'re shoddy, I\'ll take it personally.','>Dunstan|Eight items. I have a bad feeling.','>Vesperax|Don\'t fail me, little smith. I\'ve waited a long time for someone worth the trouble.'],c:[{t:'Accept the Grand Commission',end:true,fx:{trial:'grand',xp:600,fl:'dragon_met'}}]}}},

{id:'ch12',title:'The Final Assembly',icon:'🔥',when:{trial:'grand'},nodes:{
start:{p:['The Heartfire Set gleams on the bench. Eight items. All of them yours.','Dunstan is silent for a long time.','>Dunstan|To undo the curse, one last piece. The Heartfire Masterwork. It has to be made on me. By you. Using everything the set represents.','>Dunstan|It\'ll hurt. Mildly. I\'m an anvil. I\'ve been hit before.','The mentors gather round. Pip warms the forge. Hildy takes up the hammer. Gran sets out a plate of snacks, because of course she does.'],
 c:[{t:'Forge it with fire and brute strength (Might)',chk:{s:'might',dc:24,ok:'great',fail:'good'}},{t:'Forge it with precision (Finesse)',chk:{s:'finesse',dc:24,ok:'great',fail:'good'}},{t:'Forge it with heart (Charm)',chk:{s:'charm',dc:24,ok:'great',fail:'good'}}]},
great:{p:['The hammer rings. Every strike sounds like a different note. The metal glows white, then gold, then something that has no name.','When the light fades, a blade rests on the anvil. It hums softly. It is the most beautiful thing you\'ve ever made.','>Dunstan|I feel... warm.'],c:[{t:'Lift the Heartfire Masterwork',end:true,fx:{xp:1000,it:[['heartfire_blade',1]],rep:{guild:5,town:3},fl:'masterwork_done'}}]},
good:{p:['It isn\'t perfect. But it\'s <i>yours</i>, and the light from it is steady, honest, and warm.','>Dunstan|It\'s not flawless.','>Dunstan|Good. Flawless is for Calla.'],c:[{t:'Lift the Heartfire Masterwork',end:true,fx:{xp:800,it:[['heartfire_blade',1]],rep:{guild:3,town:3},fl:'masterwork_done'}}]}}},

{id:'ch13',title:'Festival of Embers',icon:'🎆',when:{after:'ch12',lv:45},nodes:{
start:{p:['The square is full. Banners, bunting, a banner that says "WELCOME DRAGON (PLEASE)" that was clearly made by a committee.','Vesperax lands in a gust of embers and a very small amount of dignity.','>Vesperax|Let me see what Tinderbury has made.','You step forward. The Heartfire Masterwork glows in your hands. The crowd goes silent. Even the goose.'],
 c:[{t:'Present the Heartfire Masterwork',go:'present'}]},
present:{p:['Vesperax studies it. She turns it. She holds it up to the sunset. A single scale on her cheek twitches.','>Vesperax|This is... remarkable.','>Vesperax|Not perfect. Better. It has a heart.','Gildenhoard pushes through the crowd, sweating through his waistcoat.','>Gildenhoard|That sword is a Concord design! I demand—'],
 c:[{t:'Let Vesperax handle him',go:'dragon'},{t:'Confront him (Charm)',chk:{s:'charm',dc:26,ok:'confront',fail:'dragon'}},{t:'Offer him a job (Charm)',chk:{s:'charm',dc:24,ok:'job',fail:'dragon'}}]},
dragon:{p:['Vesperax breathes a very small, very precise cloud of smoke. Gildenhoard\'s waistcoat catches fire, politely.','>Vesperax|Mortal, you will refund every customer. Then you will learn to make something that lasts. Or I will visit.','Gildenhoard runs. The town cheers. A goose chases him for three miles.'],c:[{t:'Celebrate',go:'curse'}]},
confront:{p:['You tell Gildenhoard the truth about thirty-one years of lies. A clerk in the crowd quietly starts crying. Someone else begins clapping. Within a minute, it\'s a standing ovation. Gildenhoard, for the first time, has nothing to say.'],c:[{t:'Celebrate',go:'curse'}]},
job:{p:['"You\'re not a bad crafter, Percival," you say. "You\'re just a bad everything else." He blinks. "I could offer you a position in my workshop. Sweeping." He weeps. He accepts.','>Dunstan|You… are going to need so many more brooms.'],c:[{t:'Celebrate',go:'curse'}]},
curse:{p:['The Heartfire Masterwork flares. The curse unspools like a ribbon in the wind. The anvil shudders.','>Dunstan|Oh. Oh, that\'s a very strange feeling.','A man stands where the anvil was: tall, gray, tired, grinning like a boy.','>Dunstan|...Right. Hello. Arms. I have arms. I forgot about arms.','He looks at the anvil beside him. It is just an anvil now, quiet, a little warm.','>Dunstan|I think... I\'d like to stay. If you\'ll have me. I\'ve grown fond of the shape. It\'s very structurally sound.'],
 c:[{t:'"Stay. Obviously."',end:true,fx:{xp:1500,sp:2,fl:'finale_done',title:'Heir of the Crucible',rep:{town:5,guild:5},ren:60}},{t:'"Go see the world."',end:true,fx:{xp:1500,sp:2,fl:'finale_done',title:'Heir of the Crucible',rep:{town:5,guild:5},ren:60}}]}}},

{id:'epilogue',title:'After the Fire',icon:'🌅',when:{after:'ch13'},nodes:{
start:{p:['Weeks pass. The Crooked Crucible is no longer crooked, or at least, no more crooked than it was designed to be.','Orders keep coming. Legendary ones. The dragon, apparently, tells everyone.','>Dunstan|Spark. Billie was right about one thing. You were worth the trouble.','>Dunstan|Now go make something terrible and charming. The world could use more of both.'],
 c:[{t:'Return to the forge',end:true,fx:{xp:300,fl:'epilogue_done',title:'Legend of the Crucible'}}]}}}
];
var STORY_BY={};STORY.forEach(function(s){STORY_BY[s.id]=s;});
var TRIALS={
craftoff:{id:'craftoff',name:'The Craft-Off',who:'Calla Brightforge',reqs:[{label:'A weapon of Fine quality or better',kind:'weapon',minQ:2,minTier:2,qty:1}],after:'ch5b',fx:{g:100,xp:150}},
grand:{id:'grand',name:'The Heartfire Set',who:'Vesperax the Unimpressed',reqs:[
 {label:'A weapon fit for a king (T5+, Superior)',kind:'weapon',minTier:5,minQ:3,qty:1},
 {label:'Armor for a queen (chest, T5+, Superior)',kind:'armor',slot:'chest',minTier:5,minQ:3,qty:1},
 {label:'A ring (T5+, Superior)',kind:'jewel',slot:'ring',minTier:5,minQ:3,qty:1},
 {label:'A cloak (T5+, Superior)',kind:'armor',slot:'back',minTier:5,minQ:3,qty:1},
 {label:'An enchanted item (T4+, Fine)',tag:'enchanted',minTier:4,minQ:2,qty:1},
 {label:'A feast (level 20+ dish)',tag:'feast',qty:1},
 {label:'A potion (T5+)',tag:'potion',minTier:5,qty:1},
