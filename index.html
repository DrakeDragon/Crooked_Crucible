function loadSave(){try{var j=localStorage.getItem(SAVE_KEY);if(!j)return null;var s=JSON.parse(j);var d=newState(s.name);for(var k in s)d[k]=s[k];if(d.crafts)CRAFTS.forEach(function(c){if(d.crafts[c.id]&&d.crafts[c.id].st>STATION_MAX_TIER.length-1)d.crafts[c.id].st=STATION_MAX_TIER.length-1;});CRAFTS.forEach(function(c){if(!d.crafts[c.id])d.crafts[c.id]={lv:1,xp:0,st:1};});MCATS.forEach(function(k){if(d.dem[k]==null)d.dem[k]=1;});return d;}catch(e){return null;}}

/* ----- inventory ----- */
function isQ(id){return !!QUALIFIED[ITEMS[id].kind];}
function ikey(id,q){return isQ(id)?id+'#'+(q||0):id;}
function pkey(k){var i=k.indexOf('#');return i<0?{id:k,q:0}:{id:k.slice(0,i),q:+k.slice(i+1)};}
function addInv(id,n,q){var k=ikey(id,q);S.inv[k]=(S.inv[k]||0)+n;}
function cnt(id){if(!isQ(id))return S.inv[id]||0;var t=0;for(var q=0;q<6;q++)t+=S.inv[id+'#'+q]||0;return t;}
function cntQ(id,minQ){if(!isQ(id))return S.inv[id]||0;var t=0;for(var q=minQ||0;q<6;q++)t+=S.inv[id+'#'+q]||0;return t;}
function take(id,n,minQ){var qs=[];if(!isQ(id)){S.inv[id]=(S.inv[id]||0)-n;if(S.inv[id]<=0)delete S.inv[id];return qs;}
  for(var q=minQ||0;q<6&&n>0;q++){var k=id+'#'+q,h=S.inv[k]||0;if(!h)continue;var t=Math.min(h,n);S.inv[k]-=t;if(S.inv[k]<=0)delete S.inv[k];n-=t;for(var i=0;i<t;i++)qs.push(q);}
  return qs;}
function canMake(r,n){for(var i=0;i<r.ing.length;i++)if(cnt(r.ing[i][0])<r.ing[i][1]*n)return false;return true;}
function maxMake(r){var m=999;r.ing.forEach(function(x){m=Math.min(m,Math.floor(cnt(x[0])/x[1]));});return m;}

/* ----- stats ----- */
function tr(id){return S.talents[id]||0;}
function parseEq(){var o={};for(var sl in S.equip){if(S.equip[sl])o[sl]=pkey(S.equip[sl]);}return o;}
function gearStat(s){var t=0,e=parseEq();for(var sl in e){var st=statsOf(e[sl].id,e[sl].q);t+=st[s]||0;}return t;}
function relicVal(k){var t=0;['relic1','relic2'].forEach(function(sl){var e=S.equip[sl];if(e){var r=RBY[pkey(e).id];if(r&&r.rb&&r.rb[k])t+=r.rb[k];}});return t;}
function attr(s){return 3+Math.floor(S.lvl/3)+tr('allround')+gearStat(s)+buffVal('stat');}
function buffVal(type){var t=0,n=now();for(var k in S.buf){var b=S.buf[k];if(b&&b.until>n&&b.type===type)t+=b.val;}return t;}
function toolBonus(type){var e=S.equip.tool;if(!e)return 0;var p=pkey(e),it=ITEMS[p.id];if(!it||it.tb!==type)return 0;return Math.round(TOOLB[type][it.tier]*TQ[p.q]*10)/10;}
function perkSum(cid,type){var c=S.crafts[cid],s=0;for(var i=0;i<PERK_N;i++)if(c.lv>=(i+1)*5){var p=perkOf(cid,i);if(p.type===type)s+=p.v;}return s;}
function marks(){var n=0;CRAFTS.forEach(function(c){if(S.crafts[c.id].lv>=15)n++;});return n;}
function maxStam(){return Math.round(60+attr('grit')*1.5+tr('strongback')*8+relicVal('stam'));}
function stamRate(){return (1/3)*(1+tr('fleet')*0.06);}
function updStam(){var t=now(),dt=(t-S.stamT)/1000;S.stamT=t;var m=maxStam();if(S.stam<m)S.stam=Math.min(m,S.stam+dt*stamRate());}
function renownRank(){var r=0;for(var i=0;i<RENOWN.length;i++)if(S.ren>=RENOWN[i])r=i;return r;}
function grumble(){return 1+tr('grumble')*0.02;}
function stationMax(cid){return STATION_MAX_TIER[S.crafts[cid].st];}

/* ----- announcements ----- */
function say(text,kind){S.msgs.unshift({t:now(),text:text,k:kind||''});if(S.msgs.length>60)S.msgs.length=60;UI.ticker=text;if(typeof uiMsg==='function')uiMsg(text,kind);}
function sfx(k){if(typeof playSfx==='function'&&S.set.sound)playSfx(k);}

/* ----- XP ----- */
function needP(l){return Math.round(50*Math.pow(l,1.52));}
function needC(l){return Math.round(20*Math.pow(l,1.55)*(l>45?0.55:1));}
function gainXp(n,quiet){n=Math.round(n*(1+tr('fastlearn')*0.03+tr('sage')*0.02)*grumble());if(n<=0||S.lvl>=PLAYER_CAP)return;S.xp+=n;
  while(S.lvl<PLAYER_CAP&&S.xp>=needP(S.lvl)){S.xp-=needP(S.lvl);S.lvl++;S.sp++;S.stam=maxStam();say('Level '+S.lvl+'! '+quip('lvl'),'lvl');sfx('lvl');if(typeof uiBig==='function')uiBig('LEVEL '+S.lvl,rankOf(S.lvl));}
  if(S.lvl>=PLAYER_CAP)S.xp=0;}
function gainCx(cid,n){var c=S.crafts[cid];if(c.lv>=CRAFT_CAP)return;c.xp+=n;
  while(c.lv<CRAFT_CAP&&c.xp>=needC(c.lv)){c.xp-=needC(c.lv);c.lv++;
   say(CBY[cid].icon+' '+CBY[cid].name+' reached level '+c.lv+'. '+quip('clvl'),'clvl');sfx('lvl');
   if(c.lv%5===0){var p=perkOf(cid,c.lv/5-1);say('New perk: '+p.name+' ('+PERK_DESC[p.type].replace('{v}',p.v)+')','perk');if(c.lv===15)say('MARK OF MASTERY earned: '+CBY[cid].name+'! ('+marks()+'/10)','mark');}
   gainXp(6+c.lv*1.5);}
  if(c.lv>=CRAFT_CAP)c.xp=0;}

/* ----- fx application ----- */
function bump(k,n){S.st[k]=(S.st[k]||0)+(n||1);}
function addGold(n){if(n>0)bump('goldEarned',n);S.gold=Math.max(0,S.gold+Math.round(n));}
function setFlag(f){(Array.isArray(f)?f:[f]).forEach(function(x){S.flags[x]=1;});}
function applyFx(fx,quiet){if(!fx)return;var out=[];
  if(fx.g){addGold(Math.round(fx.g>0?fx.g*grumble():fx.g));out.push((fx.g>0?'+':'')+fx.g+'g');}
  if(fx.xp){gainXp(fx.xp);out.push('+'+fx.xp+' XP');}
  if(fx.cx){gainCx(fx.cx[0],fx.cx[1]);out.push('+'+fx.cx[1]+' '+CBY[fx.cx[0]].name+' XP');}
  if(fx.it)fx.it.forEach(function(x){addInv(x[0],x[1],isQ(x[0])?(x[0]==='heartfire_blade'?5:2):0);out.push('+'+x[1]+' '+ITEMS[x[0]].name);});
  if(fx.rep){for(var k in fx.rep){S.rep[k]=(S.rep[k]||0)+fx.rep[k];}}
  if(fx.sp){S.sp+=fx.sp;out.push('+'+fx.sp+' talent point');}
  if(fx.ren){S.ren+=fx.ren;out.push('+'+fx.ren+' Renown');}
  if(fx.fl)setFlag(fx.fl);
  if(fx.title){S.titles[fx.title]=1;if(!S.title)S.title=fx.title;out.push('Title: '+fx.title);}
  if(fx.bless){S.buf.bless={type:fx.bless[0],val:fx.bless[1],until:now()+fx.bless[2]*60000,name:'Story Blessing',icon:'🌟'};out.push('Blessing: '+FXD[fx.bless[0]].replace('{v}',fx.bless[1]));}
  if(fx.trial){S.trial=fx.trial;S.tprog[fx.trial]=S.tprog[fx.trial]||{};}
  return out;}

/* ----- crafting ----- */
function stationOk(r){return S.crafts[r.craft].st>=1&&STATION_MAX_TIER[S.crafts[r.craft].st]>=r.tier;}
function recipeState(r){var c=S.crafts[r.craft];if(r.lvl>c.lv)return 'lv';if(!stationOk(r))return 'st';return 'ok';}
function qualPts(r){var c=S.crafts[r.craft],d=clamp((c.lv-r.lvl)*1.8,-10,45);
  return d+(c.st-1)*3+toolBonus('q')+buffVal('qual')+tr('steady')*2+perkSum(r.craft,'quality')+attr('wits')*0.3+relicVal('q');}
function rollQuality(r,hb,cq){var pts=qualPts(r)+(hb||0);if(cq&&cq.length){var a=0;cq.forEach(function(x){a+=x;});pts+=(a/cq.length-1)*3;}
  var roll=Math.random()*100+pts,q=roll<22?0:roll<78?1:roll<108?2:roll<128?3:roll<146?4:5;
  if(q<5&&Math.random()<tr('eye')*0.015)q++;return q;}
function craftDur(r){var c=S.crafts[r.craft];var sp=buffVal('speed')/100+tr('quick')*0.04+attr('finesse')*0.003+toolBonus('spd')/100+perkSum(r.craft,'speed')/100+relicVal('spd')/100+(c.st-1)*0.04;var t=r.time/(1+sp);if(S.rush>0)t*=0.4;return Math.max(0.25,t)*1000;}
function xpFor(r){var c=S.crafts[r.craft],d=c.lv-r.lvl,m=d<=3?1:d<=6?0.75:d<=9?0.5:d<=13?0.3:0.15;
  if(!S.known[r.id])m*=4;if(r.tier>=9)m*=1.6;return r.xp*m*(1+(buffVal('xp')+tr('scholar')*4+perkSum(r.craft,'xp')+toolBonus('xp')+relicVal('xp'))/100);}
function craftOne(r,hb){var cid=r.craft,it=ITEMS[r.out];
  var saveP=(buffVal('save')+tr('thrifty')*3+perkSum(cid,'save')+relicVal('save'))/100,cq=[];
  if(Math.random()>=saveP){r.ing.forEach(function(x){cq=cq.concat(take(x[0],x[1]));});}else say('Thrifty! Materials saved.','save');
  var n=r.qty;if(Math.random()<(tr('eureka')*3+perkSum(cid,'yield')+buffVal('luck')+relicVal('luck'))/100){n+=r.qty;bump('eureka');say('Eureka! Double output!','eureka');}
  var q=0;if(isQ(r.out)){q=rollQuality(r,hb,cq);}
  addInv(r.out,n,q);
  var firstTime=!S.known[r.id];S.known[r.id]=1;
  var xp=xpFor(r);gainCx(cid,Math.round(xp));gainXp(xp*0.8);
  bump('crafted',n);bump('mk_'+r.out,n);bump('cn_'+cid,n);
  if(q>=2)bump('fine');if(q>=3)bump('sup');if(q>=4)bump('mw');if(q>=5)bump('leg');
  if(it.tier===6&&isQ(r.out))bump('tier6');if(it.tier>=7&&isQ(r.out))bump('tier'+it.tier);if(it.tags&&it.tags.indexOf('enchanted')>=0)bump('enchanted');
  if(S.rush>0)S.rush--;
  if(firstTime)say('New recipe discovered: '+it.name+'. XP bonus!','disc');
  if(isQ(r.out)){if(q>=5)say(quip('legend'),'legend');else if(q===4)say(quip('master'),'master');else if(q===3&&Math.random()<0.5)say(quip('super'),'super');else if(q===0&&Math.random()<0.4)say(quip('crude'),'crude');}
  return {q:q,n:n,id:r.out};}

function startCraft(rid,n){if(JOB)return;var r=RBYID[rid];if(!r||recipeState(r)!=='ok')return;n=Math.min(n,maxMake(r));if(n<1)return;
  JOB={rid:rid,n:n,i:0,t0:now(),dur:craftDur(r),wait:false,total:n};sfx('start');}
function jobTick(){if(!JOB||JOB.wait)return;var p=(now()-JOB.t0)/JOB.dur;if(typeof uiJob==='function')uiJob(p);
  if(p>=1)finishItem();}
function finishItem(){var r=RBYID[JOB.rid];
  if(!canMake(r,1)){JOB=null;render();return;}
  if(S.set.hands&&!JOB.skipHands){JOB.wait=true;if(typeof uiHands==='function')uiHands(r);return;}
  completeItem(0);}
function completeItem(hb){var r=RBYID[JOB.rid];var res=craftOne(r,hb);JOB.i++;sfx(res.q>=3?'good':'clink');
  if(typeof uiCraftDone==='function')uiCraftDone(r,res);
  checkAch();
  if(JOB.i<JOB.n&&canMake(r,1)){JOB.t0=now();JOB.dur=craftDur(r);JOB.wait=false;}else JOB=null;
  render();save();}
function cancelJob(){JOB=null;render();}

/* ----- stations ----- */
function stationCost(cid,lv){var g=[0,0,250,2500,20000,150000,600000,2000000,7000000,20000000,60000000][lv],t=lv;
  var mats=[[INGOT[t],4+lv*2],[PLANK[t],4+lv*2]];if(lv>=3)mats.push([CLOTH[t],4+lv]);if(lv>=4)mats.push([CUT[t],2+lv]);
  return {gold:g,mats:mats,lv:STATION_REQ[lv]};}
function canUpgrade(cid){var c=S.crafts[cid];if(c.st>=STATION_MAX_TIER.length-1)return false;var k=stationCost(cid,c.st+1);if(c.lv<k.lv||S.gold<k.gold)return false;for(var i=0;i<k.mats.length;i++)if(cnt(k.mats[i][0])<k.mats[i][1])return false;return true;}
function upgradeStation(cid){if(!canUpgrade(cid))return;var c=S.crafts[cid],k=stationCost(cid,c.st+1);S.gold-=k.gold;bump('goldSpent',k.gold);k.mats.forEach(function(m){take(m[0],m[1]);});c.st++;bump('stationUps');say(CBY[cid].station+' upgraded to level '+c.st+'. '+quip('upgrade'),'up');sfx('lvl');checkAch();render();save();}

/* ----- gathering ----- */
function zoneMastery(zid){var n=S.zc[zid]||0,m=0;[25,75,150,300,600].forEach(function(t){if(n>=t)m++;});return m;}
function gatherPct(zid){return buffVal('gather')+toolBonus('gat')+relicVal('gat')+tr('keen')*4+attr('might')*0.4+zoneMastery(zid)*3;}
function lootRoll(z,rolls,into,sink){var total=0;z.loot.forEach(function(l){total+=l[1];});var got={};
  for(var i=0;i<rolls;i++){var r=Math.random()*total,l=null;for(var j=0;j<z.loot.length;j++){r-=z.loot[j][1];if(r<=0){l=z.loot[j];break;}}if(!l)l=z.loot[0];var q=rnd(l[2],l[3]);got[l[0]]=(got[l[0]]||0)+q;}
  return got;}
function addMap(map,got){for(var k in got)map[k]=(map[k]||0)+got[k];}
function gather(zid){var z=ZBY[zid];if(!z||S.lvl<z.lv)return;updStam();var cost=Math.max(1,Math.round(2*(1-tr('favor')*0.06)));
  if(S.stam<cost){say(quip('low'),'low');if(typeof uiToast==='function')uiToast('⚡ Out of stamina!');return;}
  S.stam-=cost;if(Math.random()<tr('stampede')*0.03)S.stam+=cost;
  var pct=gatherPct(zid),rolls=4+Math.floor(pct/100)+(Math.random()<(pct%100)/100?1:0);
  var got=lootRoll(z,rolls);var rare=null;
  if(Math.random()<0.015+tr('lucky')*0.01){var rr=pick(z.rare);rare={id:rr[0],n:rnd(1,rr[2])};got[rr[0]]=(got[rr[0]]||0)+rare.n;bump('rareFinds');say(quip('rare')+' '+ITEMS[rr[0]].name+' ×'+rare.n,'rare');}
  var gp=0;if(Math.random()<0.03){gp=z.lv*8+rnd(5,30);addGold(gp);}
  var fr=fragRoll(zid,1);if(fr){got[fr]=(got[fr]||0)+1;}
  for(var k in got)addInv(k,got[k],0);
  S.zc[zid]=(S.zc[zid]||0)+1;bump('gathered');gainXp(2+z.lv*0.4);
  sfx(rare?'good':'gather');if(typeof uiGather==='function')uiGather(got,rare,gp);checkAch();render();}

/* apprentices */
function haulCap(){return 120+tr('wagon')*40;}
function appInterval(a){return 25000*(1-a.lv*0.03);}
function runApprentice(a,t){var z=ZBY[a.z]||ZBY.meadows;var rolls=Math.max(1,Math.round((1.5+a.lv*0.25)*(1+tr('whisper')*0.08)));
  var got=lootRoll(z,rolls);var fr=fragRoll(a.z,0.25);if(fr)got[fr]=(got[fr]||0)+1;addMap(S.haul,got);for(var k in got)S.haulN+=got[k];a.xp++;if(a.xp>=15+a.lv*10&&a.lv<10){a.xp=0;a.lv++;}a.t=t+appInterval(a);}
function tickApps(upTo){S.app.forEach(function(a){var guard=0;while(a.t<=upTo&&S.haulN<haulCap()&&guard<800){runApprentice(a,a.t);guard++;}if(S.haulN>=haulCap()&&a.t<upTo)a.t=upTo;});}
function hireApp(){var n=S.app.length;if(n>=8||S.gold<APP_COST[n])return;S.gold-=APP_COST[n];bump('goldSpent',APP_COST[n]);
  S.app.push({n:APP_NAMES[(n*5+rnd(0,3))%APP_NAMES.length],q:pick(APP_QUIPS),z:'meadows',lv:0,xp:0,t:now()+25000});S.st.apprentices=S.app.length;say(quip('hire'),'hire');checkAch();render();save();}
function collectHaul(){var any=false;for(var k in S.haul){addInv(k,S.haul[k],0);any=true;}S.haul={};S.haulN=0;if(any){sfx('good');say('Collected the apprentices\' haul.','haul');}render();save();}

/* ----- market ----- */
function mcatOf(id){return ITEMS[id].cat;}
function satMult(id){var s=S.sat[id]||0;return Math.max(0.4,1-s*0.04);}
function sellPrice(id,q){var it=ITEMS[id];var base=it.val*(isQ(id)?QUAL[q||0].m:1);if(it.kind==='mat')base*=0.55;
  var m=S.dem[mcatOf(id)]||1;var h=1+attr('charm')*0.003+tr('haggler')*0.02+(buffVal('sell')+relicVal('sell'))/100+renownRank()*0.01;
  return Math.max(1,Math.round(base*0.5*m*satMult(id)*h*grumble()));}
function sell(key,n){var p=pkey(key),have=S.inv[key]||0;n=Math.min(n,have);if(n<=0)return;var tot=0;
  for(var i=0;i<n;i++){tot+=sellPrice(p.id,p.q);S.sat[p.id]=(S.sat[p.id]||0)+1*(1-tr('trend')*0.08);}
  S.inv[key]-=n;if(S.inv[key]<=0)delete S.inv[key];
  if(Math.random()<tr('tipjar')*0.03*n){var tip=Math.round(tot*0.2);tot+=tip;say('A generous customer left a tip: +'+tip+'g.','tip');}
  addGold(tot);bump('sold',n);sfx('coin');if(tot>=500)say(quip('sell'),'sell');checkAch();render();}
function shopList(){var ok={};ZONES.forEach(function(z){if(S.lvl>=z.lv)z.loot.forEach(function(l){ok[l[0]]=1;});});
  var out=[];Object.keys(ok).forEach(function(id){if(ITEMS[id].kind==='mat')out.push(id);});out.sort(function(a,b){return ITEMS[a].tier-ITEMS[b].tier||ITEMS[a].val-ITEMS[b].val;});return out;}
function shopPrice(id){return Math.max(1,Math.round(ITEMS[id].val*3.5*(1-tr('bargain')*0.02)*(1-renownRank()*0.01)));}
function shopStock(id){if(S.shop[id]==null)S.shop[id]=12;return S.shop[id];}
function buy(id,n){n=Math.min(n,shopStock(id));if(n<1)return;var c=shopPrice(id)*n;if(S.gold<c){if(typeof uiToast==='function')uiToast('Not enough gold');return;}S.gold-=c;bump('goldSpent',c);S.shop[id]-=n;addInv(id,n,0);sfx('coin');render();}
function tickShop(){var t=now();if(t-S.shopT>25000){var k=Math.floor((t-S.shopT)/25000);S.shopT+=k*25000;for(var id in S.shop)S.shop[id]=Math.min(12,S.shop[id]+k);}
  if(t>S.demT){S.demT=t+300000;MCATS.forEach(function(c){S.dem[c]=Math.round((0.85+Math.random()*0.5)*100)/100;});var hot=MCATS.slice().sort(function(a,b){return S.dem[b]-S.dem[a];})[0];say('Market: '+hot+' demand is up '+Math.round((S.dem[hot]-1)*100)+'%.','mkt');}
  for(var id in S.sat){S.sat[id]=Math.max(0,S.sat[id]-0.02*0.25);if(S.sat[id]<=0)delete S.sat[id];}
  if(!S.merch||S.merch.until<t){if(!S.merch||S.merch.until+600000<t){var maxT=Math.min(6,Math.floor(S.lvl/8)+2),pool=Object.keys(ITEMS).filter(function(i){var it=ITEMS[i];return it.kind==='mat'&&it.tier<=maxT&&it.tier>=Math.max(1,maxT-2);});
   var items=[];for(var i=0;i<3&&pool.length;i++){var id2=pick(pool);items.push({id:id2,n:rnd(4,10),p:Math.round(ITEMS[id2].val*2.2)});}S.merch={until:t+900000,items:items};if(S.st.crafted>2)say('A traveling merchant has set up in the market.','mkt');}}}
function buyMerch(i,n){var m=S.merch&&S.merch.items[i];if(!m)return;n=Math.min(n,m.n);if(n<1)return;var c=m.p*n;if(S.gold<c)return;S.gold-=c;bump('goldSpent',c);m.n-=n;addInv(m.id,n,0);sfx('coin');render();}

/* ----- commissions ----- */
function genCommission(){var pool=RECIPES.filter(function(r){var it=ITEMS[r.out];if(it.kind==='mat')return false;var c=S.crafts[r.craft];return r.lvl<=c.lv&&r.tier<=STATION_MAX_TIER[c.st]&&r.lvl>=Math.max(1,c.lv-12);});
  if(!pool.length)return null;var r=pick(pool),it=ITEMS[r.out],ci=rnd(0,NPCS.length-1),npc=NPCS[ci],avg=0;CRAFTS.forEach(function(c){avg+=S.crafts[c.id].lv;});avg/=CRAFTS.length;
  var qty=isQ(r.out)?rnd(1,2):rnd(2,5);var minQ=0;if(isQ(r.out)){var cap=Math.min(4,Math.floor(S.crafts[r.craft].lv/7));minQ=cap>0?rnd(0,cap):0;}
  var unit=it.val*(isQ(r.out)?QUAL[minQ].m:1);
